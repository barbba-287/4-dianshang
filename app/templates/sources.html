<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据源</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/workspace-shell.css"><link rel="stylesheet" href="/static/css/ui-v2.css"><script src="/static/toast.js?v=20261102" defer></script><style> .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem}.card,.panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:.7rem;padding:1rem;margin-top:1rem}.card-value{font-size:1.5rem;font-weight:700}.muted{color:var(--color-text-muted);font-size:.82rem}.tag{display:inline-block;padding:.25rem .55rem;border-radius:99px;background:var(--neutral-200);font-size:.75rem}.good{background:var(--color-success-soft);color:var(--color-success-strong)}.warn{background:var(--color-warning-soft);color:var(--color-warning-strong)}button{padding:.55rem .8rem;border:0;border-radius:.45rem;background:var(--color-primary);color:var(--color-on-primary);cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:.65rem;border-bottom:1px solid var(--color-border);text-align:left;font-size:.82rem}.import-form{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.75rem}.import-form select,.import-form input{padding:.5rem .6rem;border:1px solid var(--color-border);border-radius:.45rem;background:var(--color-surface);font-size:.85rem}.import-form input[type=file]{max-width:260px}.import-ghost{background:var(--color-surface);color:var(--color-primary);border:1px solid var(--color-primary)}.import-mapping{display:flex;flex-direction:column;gap:.4rem;margin-top:.75rem}.mapping-row{display:flex;gap:.6rem;align-items:center;font-size:.85rem}.mapping-row label{min-width:9rem}.mapping-row select{padding:.35rem .5rem;border:1px solid var(--color-border);border-radius:.45rem;background:var(--color-surface);font-size:.82rem;min-width:12rem}.mapping-missing{border-left:3px solid var(--color-warning-strong);padding-left:.5rem}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}.import-skip{display:flex;align-items:center;gap:.35rem;font-size:.85rem;color:var(--color-text)}.import-skip input{width:auto}.import-warn{margin-top:.6rem;padding:.55rem .75rem;border:1px solid var(--color-warning-border);border-radius:.45rem;background:var(--color-warning-soft);color:var(--color-warning-strong);font-size:.82rem}.export-btn{padding:.3rem .55rem;font-size:.75rem;border-radius:.4rem}.export-btn.import-ghost{padding:.28rem .5rem}.reject-line{color:var(--color-warning-strong);font-size:.8rem;margin-top:.35rem}</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"></aside>
<main class="main">
<header class="topbar"><div class="muted">Workspace / <strong>数据源</strong></div><button id="logout">退出登录</button></header>
<div class="content">
<div class="page-heading"><div><h1>数据源</h1><p class="muted">Shopify 走实时接口，其他平台通过报表 CSV 导入；所有来源统一进入外部事实层。</p></div><div><button id="sync">同步到外部事实层</button> <button id="refresh">刷新真实数据</button></div></div>
<p id="sync-status" class="muted"></p>
<p id="status" class="muted">正在读取连接状态…</p>
<div id="cards" class="cards"></div>
<section class="panel"><h2>报表导入（CSV）</h2>
<div class="import-form">
<select id="import-platform"><option value="taobao">淘宝</option><option value="jd">京东</option><option value="pdd">拼多多</option><option value="douyin">抖音</option><option value="amazon">亚马逊</option><option value="shopify">Shopify 报表</option></select>
<select id="import-kind"><option value="inventory">库存快照</option><option value="orders">订单</option></select>
<input id="import-account" placeholder="账号/店铺标识（留空则取文件内 account_ref 列）">
<input type="file" id="import-csv" accept=".csv,text/csv">
<button id="import-preview">预览</button>
<button id="import-commit" disabled>确认入库</button>
<button id="import-template" type="button" class="import-ghost">下载模板</button>
<label class="import-skip"><input type="checkbox" id="import-allow-skipped"> 跳过异常行</label>
</div>
<div id="import-skip-hint" class="import-warn" hidden>将跳过错误行，错误数据可在批次历史中导出修改</div>
<p id="import-status" class="muted">选择文件后先预览，确认解析结果再入库；重复导入同一文件会被自动跳过。</p>
<div id="import-mapping" class="import-mapping"></div>
<div id="import-result" class="table-wrap"></div>
</section>
<section class="panel"><h2>导入批次历史</h2><div id="import-runs" class="table-wrap"></div></section>
<section class="panel"><h2>商品预览</h2><div id="products" class="table-wrap"></div></section>
<section class="panel"><h2>库存预览</h2><div id="inventory" class="table-wrap"></div></section>
<section class="panel"><h2>订单预览</h2><div id="orders" class="table-wrap"></div></section>
</div>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
function token(){const x=document.cookie.split('; ').find(v=>v.startsWith('dianshang_csrf='));return x?decodeURIComponent(x.split('=').slice(1).join('=')):'';}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(path,opt={}){const r=await fetch(path,{...opt,credentials:'same-origin',headers:{'X-CSRF-Token':token(),...(opt.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail?.message||'请求失败');return b;}
function table(headers,rows,empty='暂无数据'){if(!rows.length)return `<div class="muted">${empty}</div>`;return `<table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
async function load(){const status=$('#status');status.className='muted';status.textContent='正在读取 Shopify 真实数据…';try{const cap=await api('/api/external/shopify/capabilities');const [products,inventory,orders]=await Promise.all(['products','inventory','orders'].map(resource=>api('/api/external/shopify/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource,live:true})})));$('#cards').innerHTML=[['店铺',cap.store_domain||'未配置'],['连接',cap.live_enabled?'已启用':'未启用'],['商品',products.total],['库存',inventory.total],['订单',orders.total]].map(([l,v])=>`<div class="card"><div class="muted">${esc(l)}</div><div class="card-value">${esc(v)}</div></div>`).join('');const productRows=products.records.flatMap(p=>(p.variants?.nodes||[]).map(v=>[p.title,v.sku||'无 SKU',v.price||'—',p.id]));$('#products').innerHTML=table(['商品','SKU','价格','Shopify Product GID'],productRows,'Shopify 没有返回商品');const invRows=inventory.records.flatMap(item=>(item.inventoryLevels?.edges||[]).map(edge=>[item.sku||item.id,edge.node?.location?.id||'—',edge.node?.quantities?.map(q=>`${q.name}:${q.quantity}`).join('、')||'—']));$('#inventory').innerHTML=table(['SKU/InventoryItem','Location GID','库存数量'],invRows,'Shopify 没有返回库存');const orderRows=orders.records.map(o=>[o.name||o.id,o.createdAt,o.updatedAt,o.displayFinancialStatus||'—',o.displayFulfillmentStatus||'—']);$('#orders').innerHTML=table(['订单','创建时间','更新时间','财务状态','履约状态'],orderRows,'当前开发店没有可读取订单；这不是接口失败');status.innerHTML=`<span class="tag good">真实 Shopify 数据</span>　来源：${esc(products.store_domain||cap.store_domain||'')}　商品/库存/订单均为只读预览`; }catch(e){status.className='error';status.textContent=`读取失败：${e.message}`;}}
$('#refresh').onclick=load;
$('#sync').onclick=async()=>{const out=$('#sync-status');out.className='muted';out.textContent='正在同步订单与库存到外部事实层…';try{const result=await api('/api/external/shopify/sync?resources=orders,inventory',{method:'POST'});out.innerHTML=`<span class="tag good">同步${esc(result.status||'完成')}</span>　运行 ID：${esc(result.run_id)}　订单 ${esc(result.resources?.orders?.total??0)} 条，库存 ${esc(result.resources?.inventory?.inserted??0)} 条已写入 ExternalInventorySnapshot；不写内部库存台账`;await load();}catch(e){out.className='error';out.textContent=`同步失败：${e.message}`;}};
const IMPORT_TEMPLATES={inventory:'external_sku,account_ref,store_ref,warehouse_ref,available_qty,reserved_qty,as_of\nS-001,我的店铺,主店铺,默认仓,120,5,2026-11-01T10:00:00Z\nS-002,我的店铺,主店铺,默认仓,0,0,2026-11-01T10:00:00Z\n',orders:'external_order_no,account_ref,store_ref,status,created_at,updated_at,external_sku,ordered_qty,gross_amount\nO-1001,我的店铺,主店铺,paid,2026-11-01T10:00:00Z,2026-11-01T10:05:00Z,S-001,2,59.80\nO-1002,我的店铺,主店铺,paid,2026-11-01T11:00:00Z,2026-11-01T11:03:00Z,S-002,1,29.90\n'};
$('#import-template').onclick=()=>{const kind=$('#import-kind').value;const blob=new Blob(['\ufeff'+IMPORT_TEMPLATES[kind]],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`导入模板-${kind==='orders'?'订单':'库存'}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
async function importRequest(path,mapping){const file=$('#import-csv').files[0];if(!file)throw Error('请先选择 CSV 文件');const form=new FormData();form.append('file',file);form.append('platform',$('#import-platform').value);form.append('kind',$('#import-kind').value);const account=$('#import-account').value.trim();if(account)form.append('account_ref',account);if(mapping&&Object.keys(mapping).length)form.append('column_mapping',JSON.stringify(mapping));if($('#import-allow-skipped').checked)form.append('allow_skipped','true');const out=$('#import-status');out.className='muted';out.textContent=path.endsWith('/preview')?'正在解析…':'正在入库…';return api(path,{method:'POST',body:form});}
async function exportRun(runId,view,badCount){if(view==='rejected'&&!badCount){toast.warning('该批次没有异常行');return;}try{const r=await fetch(`/api/external/imports/${encodeURIComponent(runId)}/export?view=${view}`,{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':token()}});if(!r.ok){const b=await r.json().catch(()=>({}));throw Error(b.detail?.message||'导出失败');}const blob=await r.blob();const disp=r.headers.get('Content-Disposition')||'';const hit=/filename="([^"]+)"/.exec(disp);const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=hit?hit[1]:`wb-export-${runId.slice(0,8)}-${view}.xlsx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast.success(view==='rejected'?'异常明细已开始下载':'批次结果已开始下载');}catch(e){toast.error(`导出失败：${e.message}`);}}
async function renderRuns(){try{const runs=await api('/api/external/sync/runs');const list=runs.filter(r=>r.source_mode==='csv').slice(0,20);if(!list.length){$('#import-runs').innerHTML='<div class="muted">还没有 CSV 导入批次</div>';return;}const head=['时间','平台','类型','总数','新增','跳过','冲突','异常','状态','操作'].map(h=>`<th>${h}</th>`).join('');const body=list.map(r=>{const when=(r.started_at||'').replace('T',' ').slice(0,19)||'—';const kind=r.sync_type==='orders'?'订单':'库存';const bad=r.rejected_count||0;return `<tr><td>${esc(when)}</td><td>${esc(r.platform)}</td><td>${esc(kind)}</td><td>${esc(r.total)}</td><td>${esc(r.inserted)}</td><td>${esc(r.no_op)}</td><td>${esc(r.conflict)}</td><td>${bad?`<span class="tag warn">${esc(bad)}</span>`:'—'}</td><td>${esc(r.status)}</td><td><button class="export-btn" data-run="${esc(r.run_id)}" data-view="raw" data-bad="${bad}">导出结果</button> <button class="export-btn import-ghost" data-run="${esc(r.run_id)}" data-view="rejected" data-bad="${bad}">导出异常</button></td></tr>`;}).join('');$('#import-runs').innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;document.querySelectorAll('.export-btn').forEach(b=>{b.onclick=()=>exportRun(b.dataset.run,b.dataset.view,Number(b.dataset.bad||0));});}catch(e){$('#import-runs').innerHTML=`<div class="muted">批次历史读取失败：${esc(e.message)}</div>`;}}
const FIELD_LABELS={external_sku:'商品编码（SKU）',account_ref:'账号标识',store_ref:'店铺',warehouse_ref:'仓库',available_qty:'可售库存',reserved_qty:'占用库存',inbound_qty:'在途库存',as_of:'快照时间',external_order_no:'订单号',external_created_at:'下单时间',external_updated_at:'更新时间',order_status:'订单状态',paid_at:'付款时间',ordered_qty:'数量',gross_amount:'实付金额',refund_amount:'退款金额',currency:'币种'};
const IMPORT_REQUIRED={inventory:['external_sku','as_of'],orders:['external_order_no','external_created_at']};
let lastHeaders=[];let lastMissing=[];let lastRejectedTotal=0;let lastPreviewBody=null;
function collectMapping(){const m={};document.querySelectorAll('[data-mapping-field]').forEach(s=>{if(s.value)m[s.value]=s.dataset.mappingField;});return m;}
function renderMapping(body){lastHeaders=body.csv_headers||[];lastMissing=body.missing_required_fields||[];const suggestion=body.mapping_suggestion||{};const required=IMPORT_REQUIRED[$('#import-kind').value]||[];const fields=[...new Set([...Object.keys(suggestion),...lastMissing])];if(!fields.length){$('#import-mapping').innerHTML='';return;}const rows=fields.map(f=>{const col=suggestion[f]||'';const isReq=required.includes(f);const danger=isReq&&!col;const opts=['<option value="">不映射</option>',...lastHeaders.map(h=>`<option value="${esc(h)}"${h===col?' selected':''}>${esc(h)}</option>`)].join('');return `<div class="mapping-row${danger?' mapping-missing':''}" data-field="${esc(f)}"><span class="badge ${col?'badge-success':'badge-neutral'}">${col?'✓ 已识别':(isReq?'必填 · 未识别':'未识别')}</span><label>${esc(FIELD_LABELS[f]||f)}</label><select data-mapping-field="${esc(f)}">${opts}</select></div>`;}).join('')+`<button id="import-remap" type="button" class="import-ghost">应用映射并重新预览</button>`;$('#import-mapping').innerHTML=rows;$('#import-remap').onclick=async()=>{try{const body=await importRequest('/api/external/imports/preview',collectMapping());renderPreview(body);}catch(e){const out=$('#import-status');out.className='error';out.textContent=`解析失败：${e.message}`;}};}
function syncCommitState(){const blocked=(lastMissing||[]).length>0||((lastRejectedTotal||0)>0&&!$('#import-allow-skipped').checked);$('#import-commit').disabled=blocked;}
function renderPreview(body){const out=$('#import-status');lastPreviewBody=body;lastRejectedTotal=body.rejected_total||0;const rejected=body.rejected_rows||[];if((body.missing_required_fields||[]).length){out.innerHTML=`<span class="tag warn">有必填字段未识别</span>　缺少：${esc(body.missing_required_fields.map(f=>FIELD_LABELS[f]||f).join('、'))}　请在下方下拉中手动指定后「应用映射并重新预览」`;}else if(lastRejectedTotal){const head=rejected.slice(0,3).map(r=>`第 ${esc(r.row_number)} 行：${esc(r.reason_message)}`).join('；');out.innerHTML=`<span class="tag warn">${esc(lastRejectedTotal)} 行校验失败</span>　${head}${lastRejectedTotal>rejected.length?' 等':''}　${$('#import-allow-skipped').checked?'将跳过这些行入库，异常行可在批次历史导出':'勾选「跳过异常行」可跳过其入库，否则请修正后重传'}`;}else{out.innerHTML=`<span class="tag good">解析成功</span>　共 ${esc(body.total)} 行　识别编码：${esc(body.detected_encoding)}　确认无误后点击「确认入库」`;}const rows=body.normalized_rows.map(r=>[r.external_sku,r.account_ref,r.store_ref??'—',r.available_qty??r.gross_amount??'—',r.as_of??r.external_created_at??'—']);$('#import-result').innerHTML=rows.length?table(['SKU','账号','店铺','数量/金额','时间'],rows):`<div class="muted">暂无可展示数据行${(body.missing_required_fields||[]).length?'（补全映射后重新预览）':''}</div>`;renderMapping(body);syncCommitState();}
$('#import-allow-skipped').onchange=()=>{$('#import-skip-hint').hidden=!$('#import-allow-skipped').checked;if(lastPreviewBody)renderPreview(lastPreviewBody);else syncCommitState();};
$('#import-preview').onclick=async()=>{const out=$('#import-status');$('#import-commit').disabled=true;try{const body=await importRequest('/api/external/imports/preview',collectMapping());renderPreview(body);}catch(e){out.className='error';out.textContent=`解析失败：${e.message}`;}};
let lastPreview=null;
$('#import-commit').onclick=async()=>{const out=$('#import-status');const button=$('#import-commit');button.disabled=true;try{const body=await importRequest('/api/external/imports',collectMapping());const skipped=body.rejected_count||0;out.innerHTML=`<span class="tag good">导入完成</span>　新增 ${esc(body.inserted)}，跳过 ${esc(body.no_op)}，冲突 ${esc(body.conflict)}${skipped?`，异常行 ${esc(skipped)}（可在下方批次历史「导出异常」取回）`:''}　运行 ID：${esc(body.sync_run_id)}`;toast.success(`导入完成：新增 ${body.inserted} 条${skipped?`，跳过异常行 ${skipped} 条`:''}`);await renderRuns();}catch(e){out.className='error';out.textContent=`导入失败：${e.message}`;}finally{button.disabled=false;syncCommitState();}};
$('#logout').onclick=async()=>{await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':token()}});location.href='/login';};
load();
renderRuns();
</script>
</body>
</html>

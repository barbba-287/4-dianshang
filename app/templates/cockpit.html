<style>body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-sans)}.sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:232px;height:100vh;overflow-y:auto;padding:1.35rem 1rem;background:var(--color-nav-bg);color:var(--color-text-inverse)}.brand-mark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.55rem;background:var(--brand);color:var(--color-on-primary)}.nav a:hover,.nav a.active{background:var(--color-nav-overlay);color:var(--color-on-primary)}.main{min-width:0;margin-left:232px}.topbar{height:4.3rem;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:var(--panel);border-bottom:1px solid var(--line)}.top-actions{display:flex;align-items:center;gap:.8rem;font-size:.86rem}.avatar{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700}.content{max-width:1440px;margin:0 auto;padding:1.65rem 2rem 3rem}.muted{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:.65rem;margin-bottom:1.1rem}.field{display:flex;flex-direction:column;gap:.28rem;font-size:.78rem;color:var(--muted)}select,input,button{min-height:2.35rem;padding:.48rem .7rem;border:1px solid var(--color-border-input);border-radius:.45rem;background:var(--color-surface);color:var(--ink);font:inherit}button:hover{filter:brightness(.96)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;box-shadow:var(--shadow)}.card-label{color:var(--muted);font-size:.78rem}.card-value{margin-top:.35rem;font-size:2.4rem;line-height:1.15;font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.card-unit{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:.25rem}.card-change{margin-top:.3rem;font-size:.8rem;color:var(--ink)}.card-note{margin-top:.3rem;font-size:.75rem;color:var(--muted)}.card details{margin-top:.5rem;font-size:.75rem;color:var(--muted)}.card details summary{cursor:pointer;color:var(--brand)}.card-quality{display:inline-block;margin-top:.4rem;padding:.16rem .45rem;border-radius:999px;background:var(--neutral-200);font-size:.7rem;color:var(--color-text-subtle)}.card-quality.partial{background:var(--color-warning-soft);color:var(--color-warning-strong)}.card-quality.complete{background:var(--color-success-soft);color:var(--color-success-strong)}.chart-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:1rem}.chart{height:320px;min-height:260px;position:relative}.chart-empty{display:grid;place-items:center;height:100%;padding:1rem;border:1px dashed var(--color-border-input-strong);border-radius:.5rem;color:var(--muted);font-size:.88rem;text-align:center;line-height:1.5}.chart-refreshing{position:absolute;top:.4rem;right:.5rem;padding:.15rem .45rem;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:.72rem}.skeleton{height:100%;border-radius:.5rem;background:linear-gradient(90deg,var(--color-bg-canvas-start),var(--color-bg-canvas-end),var(--color-bg-canvas-start));background-size:200% 100%;animation:sk 1.2s linear infinite}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:.62rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.84rem}th{color:var(--muted);font-size:.75rem;font-weight:650;white-space:nowrap}td{font-variant-numeric:tabular-nums}.tag.good{background:var(--color-success-soft);color:var(--color-success-strong)}.tag.warn{background:var(--color-warning-soft);color:var(--color-warning-strong)}.tag.critical{background:var(--color-danger-soft);color:var(--color-danger-strong)}.tag.info{background:var(--color-primary-soft);color:var(--color-primary-deep)}.tag.insufficient{background:var(--color-bg-muted);color:var(--color-text-subtle)}.empty{padding:1.2rem;text-align:center;border:1px dashed var(--color-border-dashed);border-radius:.5rem;color:var(--muted)}.status-line{min-height:1.35rem;margin:.7rem 0;color:var(--muted);font-size:.82rem}.error-panel{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem;border:1px solid var(--color-danger-border);border-radius:.55rem;background:var(--color-danger-muted);color:var(--color-danger-strong);font-size:.85rem}.todo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.todo-grid .panel{margin-top:0}.metric-definitions{margin-top:1rem;font-size:.78rem;color:var(--muted)}.metric-definitions li{margin:.25rem 0}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-grid{grid-template-columns:1fr}}@media(max-width:1000px){.shell{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:.9rem .65rem}.brand-text,.nav-label,.nav a span{display:none}.brand{justify-content:center}.nav a{justify-content:center}.topbar{padding:0 1rem}.content{padding:1.2rem}}@media(max-width:600px){.shell{display:block}.sidebar{display:none}.topbar{height:3.8rem}.content{padding:.9rem}.page-heading{display:block}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}.card{padding:.75rem}.card-value{font-size:1.7rem}.todo-grid{grid-template-columns:1fr}.toolbar .field{flex:1 1 130px}.chart{height:260px}.panel{padding:.85rem}}
.card-clickable{cursor:pointer;transition:border-color .15s}.card-clickable:hover{border-color:var(--color-border-input-strong)}.card-clickable .card-hint{margin-top:.35rem;font-size:.72rem;color:var(--brand)}

</style></head>
<body><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div class="crumb">Workspace / <strong>经营驾驶舱</strong></div><div class="top-actions"><span class="muted">当前 Workspace 数据</span><button id="logout" type="button">退出登录</button></div></header><div class="content"><div class="page-heading"><div><h1>经营驾驶舱</h1></div><button id="refresh" type="button">刷新数据</button></div><div class="toolbar"><label class="field">统计窗口<select id="days"><option value="7" selected>近 7 天</option><option value="14">近 14 天</option><option value="30">近 30 天</option></select></label><label class="field">库存状态<select id="inventory-filter"><option value="">全部状态</option><option value="out_of_stock">缺货</option><option value="below_reorder">低于补货点</option><option value="overstock">积压</option></select></label><button id="clear-filter" type="button">清除筛选</button></div><p id="message" class="status-line" role="status">正在加载…</p><div id="cockpit-error" class="error-panel" hidden><span id="cockpit-error-text">驾驶舱数据加载失败。</span><button id="cockpit-retry" type="button">重试</button></div><section class="cards" id="kpi-grid" aria-label="关键指标"></section><div class="chart-grid"><section class="panel" id="cockpit-sales-panel"><div class="panel-head"><div><h2>销售趋势</h2></div><span class="tag" id="cockpit-sales-meta">等待数据</span></div><div id="sales-chart" class="chart"></div></section><section class="panel" id="cockpit-inventory-panel"><div class="panel-head"><div><h2>库存分布</h2></div><span class="tag" id="cockpit-inventory-meta">等待数据</span></div><div id="inventory-pie" class="chart"></div><p id="unknown-policy-note" class="panel-subtitle"></p></section></div><section class="panel" id="cockpit-profit-trend-panel"><div class="panel-head"><div><h2>利润趋势</h2></div><span class="tag" id="cockpit-profit-trend-meta">等待数据</span></div><div id="profit-trend-chart" class="chart"></div><p id="profit-trend-note" class="profit-note"></p></section><section class="panel" id="cockpit-profit-panel"><div class="panel-head"><div><h2>单品利润排行</h2></div><span class="tag" id="cockpit-profit-meta">等待数据</span></div><p id="profit-warning" class="profit-warning" hidden></p><div id="profit-ranking"></div><div id="profit-detail" hidden></div><p id="profit-note" class="profit-note"></p></section><div class="todo-grid"><section class="panel" id="cockpit-shortage-panel"><div class="panel-head"><div><h2>缺货与补货待办</h2></div><span class="tag" id="cockpit-shortage-meta">等待数据</span></div><div id="todo-shortage" class="table-wrap"></div></section><section class="panel" id="cockpit-overstock-panel"><div class="panel-head"><div><h2>积压与滞销待办</h2></div><span class="tag" id="cockpit-overstock-meta">等待数据</span></div><div id="todo-overstock" class="table-wrap"></div></section><section class="panel" id="cockpit-purchase-panel"><div class="panel-head"><div><h2>采购待审批</h2></div><span class="tag" id="cockpit-purchase-meta">等待数据</span></div><div id="todo-purchase" class="table-wrap"></div></section><section class="panel" id="cockpit-inbound-panel"><div class="panel-head"><div><h2>未完成入库</h2></div><span class="tag" id="cockpit-inbound-meta">等待数据</span></div><div id="todo-inbound" class="table-wrap"></div></section></div></div></main></div><script src="/static/echarts.min.js"></script><script src="/static/echarts-theme.js?v=20261102"></script><script>
const $=s=>document.querySelector(s);
const message=$('#message');
const colors={blue:'#2a78d6',orange:'#d58b00',aqua:'#1baf7a',purple:'#8b5cf6',critical:'#d03b3b',ink:'#142033'};
const distributionColors={out_of_stock:colors.critical,below_reorder:colors.warning,healthy:colors.aqua,overstock:colors.blue};
const distributionLabels={out_of_stock:'缺货',below_reorder:'低于补货点',healthy:'健康',overstock:'积压'};
const qualityLabels={complete:'数据完整',partial:'部分覆盖',insufficient:'数据不足'};
const qualityReasons={NO_ORDER_FACTS:'窗口内无订单事实',PARTIAL_DATA_COMPLETENESS:'部分订单数据不完整',NO_INVENTORY_FACTS:'无库存台账事实',SKU_WITHOUT_POLICY:'部分 SKU 缺库存策略',NO_SALES_FACTS:'近 30 天无销量事实',INCOMPLETE_SALES_COVERAGE:'销量覆盖不完整',NO_PURCHASE_REQUESTS:'无采购单事实',NO_INBOUND_ORDERS:'无入库单事实',NO_DOCUMENTS:'无文档事实',NO_ORDERS:'窗口内无订单事实',NO_COST_SNAPSHOTS:'没有任何入库成本，利润无法计算',MISSING_COST_SNAPSHOTS:'部分订单缺入库成本'};
const overstockTexts={NO_SALES:'因近 30 天无销量滞销',SLOW_MOVING:'预计可售超 90 天'};
let body=null,requestSequence=0,salesChart=null,inventoryChart=null,profitTrendChart=null,firstLoad=true;

function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function chartEmpty(id,text){const node=$(id);if(!node)return;node.innerHTML=`<div class="chart-empty">${escapeHtml(text)}</div>`;}
function disposeCharts(){if(salesChart){salesChart.dispose();salesChart=null;}if(inventoryChart){inventoryChart.dispose();inventoryChart=null;}if(profitTrendChart){profitTrendChart.dispose();profitTrendChart=null;}}
function formatChange(ratio){if(ratio===null||ratio===undefined)return '上一窗口无基数，无法计算环比';const percent=(Number(ratio)*100).toFixed(1);if(Number(ratio)>0)return `↑ 环比上升 ${percent}%`;if(Number(ratio)<0)return `↓ 环比下降 ${percent}%`;return '— 环比持平';}
function qualityText(card){const label=qualityLabels[card.quality]||card.quality||'数据未知';const reason=qualityReasons[card.reason];return reason?`${label}（${reason}）`:label;}
function renderKpis(){const kpis=body?.kpis||{};const order=['gmv','orders','estimated_profit','out_of_stock_skus','overstock_skus','pending_purchase_approvals','knowledge_chunks'];$('#kpi-grid').innerHTML=order.map(key=>{const card=kpis[key];if(!card)return '';const value=card.value===null||card.value===undefined?'—':escapeHtml(card.value);const unit=card.unit?`<span class="card-unit">${escapeHtml(card.unit)}</span>`:'';const change=card.change_ratio!==undefined&&card.change_ratio!==null?`<div class="card-change">${escapeHtml(formatChange(card.change_ratio))}</div>`:'';const quality=card.quality?`<span class="card-quality ${escapeHtml(card.quality)}">${escapeHtml(qualityText(card))}</span>`:'';const drill=key==='estimated_profit'?' data-profit-drill="1" title="'+escapeHtml(card.note||'')+'"':'';
const hint=key==='estimated_profit'?'<div class="card-hint">点击查看利润明细 →</div>':'';
return `<article class="card${drill?' card-clickable':''}"${drill}><div class="card-label">${escapeHtml(card.label||key)}</div><div class="card-value">${value}${unit}</div>${change}${quality}${hint}</article>`;}).join('');const trigger=document.querySelector('[data-profit-drill]');if(trigger)trigger.onclick=toggleProfitDetail;}
function renderSalesTrend(){const node=$('#sales-chart');const trend=body?.sales_trend;const dates=trend?.dates||[];const gmvByCurrency=trend?.gmv_by_currency||{};const currencies=Object.keys(gmvByCurrency);const orderCounts=trend?.order_counts||[];const daysWithData=trend?.days_with_data||[];const hasData=dates.length>0&&(currencies.some(currency=>(gmvByCurrency[currency]||[]).some(value=>value!==null&&value!==undefined))||orderCounts.some(count=>Number(count)>0)||daysWithData.some(Boolean));if(salesChart){salesChart.dispose();salesChart=null;}if(!hasData){chartEmpty('#sales-chart','当前 Workspace 无订单事实，暂无可绘制的销售趋势（demo 环境未生成订单，请先在 Shopify 页同步订单）');$('#cockpit-sales-meta').textContent=trend?.missing_days?`缺失 ${trend.missing_days} 天`:'暂无数据';return;}const orderBars=orderCounts.map((count,index)=>daysWithData[index]===false?null:count);const series=currencies.map((currency,index)=>({name:`GMV（${currency}）`,type:'line',yAxisIndex:0,data:gmvByCurrency[currency]||[],smooth:false,connectNulls:false,symbol:'circle',symbolSize:7,lineStyle:{width:2,color:[colors.blue,colors.orange,colors.purple,colors.aqua][index%4]},itemStyle:{color:[colors.blue,colors.orange,colors.purple,colors.aqua][index%4]},areaStyle:index===0&&currencies.length===1?{color:'rgba(42,120,214,.10)'}:undefined}));series.push({name:'订单数',type:'bar',yAxisIndex:1,barMaxWidth:26,data:orderBars,itemStyle:{color:'rgba(213,139,0,.35)',borderRadius:[4,4,0,0]}});salesChart=echarts.init(node,'wb');salesChart.setOption({animation:false,grid:{left:64,right:56,top:28,bottom:38},legend:{data:series.map(item=>item.name),bottom:2},tooltip:{trigger:'axis',valueFormatter:value=>value==null?'数据缺失':value},xAxis:{type:'category',data:dates,axisLabel:{formatter:value=>value.slice(5)}},yAxis:[{type:'value',name:'金额',min:0,},{type:'value',name:'订单数',min:0,splitLine:{show:false}}],series});$('#cockpit-sales-meta').textContent=`${dates.length} 天窗口 · 缺失 ${trend.missing_days||0} 天`;}
function renderInventoryPie(){const node=$('#inventory-pie');const dist=body?.inventory_distribution||{};const keys=Object.keys(distributionLabels);const total=keys.reduce((sum,key)=>sum+(Number(dist[key])||0),0);if(inventoryChart){inventoryChart.dispose();inventoryChart=null;}if(!total){chartEmpty('#inventory-pie','当前 Workspace 无库存策略，无法判定库存分布（请先为 SKU 配置安全库存与补货点）');$('#cockpit-inventory-meta').textContent='暂无数据';$('#unknown-policy-note').textContent='';return;}const data=keys.filter(key=>Number(dist[key])>0).map(key=>({name:distributionLabels[key],value:Number(dist[key])||0,itemStyle:{color:distributionColors[key]}}));inventoryChart=echarts.init(node,'wb');inventoryChart.setOption({animation:false,color:keys.map(key=>distributionColors[key]),tooltip:{trigger:'item',formatter:'{b}：{c} 个 SKU（{d}%）'},legend:{bottom:2},series:[{type:'pie',radius:['42%','68%'],center:['50%','46%'],avoidLabelOverlap:true,label:{formatter:'{b} {c}',color:colors.ink},data}]});$('#cockpit-inventory-meta').textContent=`${total} 个 SKU`;$('#unknown-policy-note').textContent=dist.unknown_policy?`另有 ${dist.unknown_policy} 个 SKU 无库存策略，未计入缺货判定。`:'';}
function statusBadge(status){const map={out_of_stock:['critical','缺货'],below_reorder:['warn','低于补货点'],NO_SALES:['warn','因近 30 天无销量滞销'],SLOW_MOVING:['info','预计可售超 90 天'],expected:['warn','待收货'],received:['info','已收货未确认'],submitted:['info','待审批'],approved:['good','已审批'],rejected:['critical','已驳回'],cancelled:['insufficient','已取消'],draft:['insufficient','草稿'],confirmed:['good','已确认']};const hit=map[status]||['','状态：'+(status||'未知')];return `<span class="tag ${hit[0]}">${escapeHtml(hit[1])}</span>`;}
function renderShortage(){const filter=$('#inventory-filter').value;const items=(body?.todo?.shortage||[]).filter(item=>!filter||item.status===filter);const target=$('#todo-shortage');if(!items.length){target.innerHTML=`<div class="empty">${filter?'当前筛选下没有匹配的缺货 SKU，可点击「清除筛选」查看全部':'当前没有缺货 SKU（on_hand 均高于安全库存）'}</div>`;}else{target.innerHTML=`<table><thead><tr><th>SKU</th><th class="num">库存</th><th class="num">安全库存</th><th class="num">补货点</th><th>状态</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.sku_code||'未命名 SKU')}</td><td class="num">${escapeHtml(item.on_hand_qty)}</td><td class="num">${escapeHtml(item.safety_stock_qty)}</td><td class="num">${escapeHtml(item.reorder_point_qty)}</td><td>${statusBadge(item.status)}</td></tr>`).join('')}</tbody></table>`;}$('#cockpit-shortage-meta').textContent=`${items.length} 条`;}
function renderOverstock(){const filter=$('#inventory-filter').value;const items=(body?.todo?.overstock||[]).filter(item=>!filter||filter==='overstock');const target=$('#todo-overstock');if(!items.length){target.innerHTML='<div class="empty">当前没有积压 SKU（近 30 天有销量且可售天数未超阈值）</div>';}else{target.innerHTML=`<table><thead><tr><th>SKU</th><th class="num">库存</th><th class="num">日均销量</th><th class="num">可售天数</th><th>原因</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.sku_code||'未命名 SKU')}</td><td class="num">${escapeHtml(item.on_hand_qty)}</td><td class="num">${item.avg_daily_qty===null||item.avg_daily_qty===undefined?'—':escapeHtml(item.avg_daily_qty)}</td><td class="num">${item.days_of_inventory===null||item.days_of_inventory===undefined?'—':escapeHtml(item.days_of_inventory)}</td><td><span class="tag warn">${escapeHtml(overstockTexts[item.reason]||item.reason||'原因未知')}</span></td></tr>`).join('')}</tbody></table>`;}$('#cockpit-overstock-meta').textContent=`${items.length} 条`;}
function renderPurchase(){const items=body?.todo?.purchase_approvals||[];const target=$('#todo-purchase');if(!items.length){target.innerHTML='<div class="empty">当前没有待审批采购单</div>';}else{target.innerHTML=`<table><thead><tr><th>采购单号</th><th class="num">仓库</th><th>状态</th><th>创建时间</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.ref||'—')}</td><td class="num">${escapeHtml(item.warehouse_id??'—')}</td><td>${statusBadge(item.status)}</td><td>${escapeHtml((item.created_at||'').slice(0,19).replace('T',' ')||'—')}</td></tr>`).join('')}</tbody></table>`;}$('#cockpit-purchase-meta').textContent=`${body?.todo?.pending_purchase_count??items.length} 条`;}
function renderInbound(){const items=body?.todo?.pending_inbounds||[];const target=$('#todo-inbound');if(!items.length){target.innerHTML='<div class="empty">当前没有未完成入库单</div>';}else{target.innerHTML=`<table><thead><tr><th>入库单号</th><th class="num">仓库</th><th>状态</th><th>创建时间</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.ref||'—')}</td><td class="num">${escapeHtml(item.warehouse_id??'—')}</td><td>${statusBadge(item.status)}</td><td>${escapeHtml((item.created_at||'').slice(0,19).replace('T',' ')||'—')}</td></tr>`).join('')}</tbody></table>`;}$('#cockpit-inbound-meta').textContent=`${body?.todo?.pending_inbound_count??items.length} 条`;}
function showSkeleton(){if(!firstLoad)return;$('#kpi-grid').innerHTML=Array.from({length:6},()=>'<div class="card"><div class="skeleton" style="height:96px"></div></div>').join('');$('#sales-chart').innerHTML='<div class="skeleton"></div>';$('#inventory-pie').innerHTML='<div class="skeleton"></div>';}
function clearError(){$('#cockpit-error').hidden=true;$('#cockpit-error-text').textContent='';}
function showError(text){$('#cockpit-error').hidden=false;$('#cockpit-error-text').textContent=text||'驾驶舱数据加载失败，请稍后重试。';}
// ---------- P7-S3 预估利润：排行 + 下钻 ----------
const profitPage={limit:50,offset:0,sku:'',total:0};
let profitSeq=0,profitTrendSeq=0;
function profitRow(item){const p=Number(item.profit);const cls=p>0?'num-gain':'num-loss';const code=item.sku_code||'';const label=code?`<a href="/orders?sku=${encodeURIComponent(code)}" title="查看该 SKU 的销售记录">${escapeHtml(code)}</a>`:`#${escapeHtml(item.sku_id)}`;return `<tr><td>${label}</td><td class="num">${escapeHtml(item.net_qty)}</td><td class="num">${escapeHtml(item.revenue)}</td><td class="num">${escapeHtml(item.cost)}</td><td class="num">${escapeHtml(item.platform_fee)}</td><td class="num ${cls}">${escapeHtml(item.profit)}</td></tr>`;}
function profitTable(items,empty){const head='<thead><tr><th>SKU</th><th class="num">净数量</th><th class="num">实付净额</th><th class="num">成本</th><th class="num">平台费</th><th class="num">利润</th></tr></thead>';return items.length?`<div class="table-wrap"><table class="profit-table">${head}<tbody>${items.map(profitRow).join('')}</tbody></table></div>`:`<div class="empty">${escapeHtml(empty)}</div>`;}
function renderProfit(){const p=body?.profit||{};const meta=$('#cockpit-profit-meta');const warn=$('#profit-warning');const note=$('#profit-note');if(!meta||!warn)return;const ranking=p.ranking||{};const winners=ranking.winners||[];const losers=ranking.losers||[];const wd=p.warning||{};if(wd.show&&wd.message){warn.hidden=false;warn.textContent=wd.message;}else{warn.hidden=true;warn.textContent='';}
const currencies=p.by_currency||[];meta.className='tag '+(p.quality==='complete'?'good':p.quality==='partial'?'warn':'insufficient');meta.textContent=currencies.length?(p.multi_currency?'多币种分组':`${currencies[0].currency} · 可算 ${currencies[0].computed_lines} 行`):(p.reason?qualityReasons[p.reason]||'暂无数据':'暂无数据');
if(!winners.length&&!losers.length){$('#profit-ranking').innerHTML=`<div class="empty">${escapeHtml(currencies.length?'当前窗口内没有可排行的利润：成本已锚定但无成交，或利润恰为 0':'暂无成本快照。请先在「仓库收货」录入入库单价，或在「数据源」导入成本 CSV')}</div>`;if(note)note.textContent='';return;}
$('#profit-ranking').innerHTML=`<div class="profit-grid"><div><h3>Top 10 赚钱</h3>${profitTable(winners,'无正利润 SKU')}</div><div><h3>Top 10 亏钱</h3>${profitTable(losers,'当前窗口无亏损 SKU')}</div></div>`;
if(note)note.textContent=`${p.formula?.profit||''}；${p.formula?.platform_fee||''}。金额为预估口径，不含运费、仓储与退货处理成本；点击 SKU 可跳转到该商品的销售记录。`;}
async function toggleProfitDetail(){const node=$('#profit-detail');if(!node)return;if(!node.hidden){node.hidden=true;node.innerHTML='';return;}node.hidden=false;node.innerHTML='<div class="empty">正在加载利润明细…</div>';profitPage.offset=0;profitPage.sku='';await loadProfitDetail();}
async function loadProfitDetail(){const node=$('#profit-detail');if(!node)return;const seq=++profitSeq;const days=Number($('#days').value||7);const params=new URLSearchParams({days:String(days),limit:String(profitPage.limit),offset:String(profitPage.offset)});if(profitPage.sku)params.set('sku_code',profitPage.sku);try{const response=await fetch(`/api/finance/profit/lines?${params.toString()}`,{credentials:'same-origin'});const data=await response.json();if(seq!==profitSeq)return;if(!response.ok)throw new Error(data.detail?.message||'利润明细加载失败');profitPage.total=Number(data.total||0);renderProfitDetail(data);}catch(error){if(seq!==profitSeq)return;node.innerHTML=`<div class="empty">利润明细加载失败：${escapeHtml(error.message||'网络错误')}</div>`;}}
function renderProfitDetail(data){const node=$('#profit-detail');const items=data.items||[];const total=Math.max(0,Number(data.total||0));const size=Math.max(1,Number(data.limit||profitPage.limit));const offset=Number(data.offset||0);const pages=Math.max(1,Math.ceil(total/size));const page=Math.floor(offset/size)+1;const head=`<div class="panel-head" style="margin:1rem 0 .5rem"><h3 style="margin:0;font-size:.86rem;color:var(--muted)">利润明细 · 第 ${page} / ${pages} 页 · 本页 ${items.length} 行 / 共 ${total} 行（按订单时间倒序）</h3><div><button class="export-btn" type="button" data-profit-export="xlsx">导出 Excel</button> <button class="export-btn import-ghost" type="button" data-profit-export="csv">导出 CSV</button></div></div>`;const pager=`<div class="profit-pager"><div class="pager-group"><input id="profit-line-sku" class="pager-input" type="search" value="${escapeHtml(profitPage.sku)}" placeholder="按 SKU 内部编码筛选" aria-label="按 SKU 内部编码筛选"><button class="export-btn import-ghost" type="button" data-pager="filter">筛选</button><button class="export-btn import-ghost" type="button" data-pager="clear">清除</button></div><div class="pager-group"><label class="pager-info" for="profit-line-size">每页 <select id="profit-line-size" class="pager-select">${[50,100,200].map(n=>`<option value="${n}"${n===size?' selected':''}>${n}</option>`).join('')}</select> 行</label><button class="export-btn import-ghost" type="button" data-pager="prev"${offset<=0?' disabled':''}>上一页</button><span class="pager-info" id="profit-line-info">第 ${page} / ${pages} 页 · 共 ${total} 行</span><button class="export-btn import-ghost" type="button" data-pager="next"${offset+size>=total?' disabled':''}>下一页</button></div></div>`;const note=`<p class="profit-note">本页可计算行利润合计 ${escapeHtml(data.page_profit)}（共 ${escapeHtml(data.page_computed)} 行）；全窗口合计见上方利润卡，切换页码不会改变它。缺成本 / 未映射的行显示状态标签而非 0，避免把「不知道」读成「不赚钱」。${profitPage.sku?`当前筛选：${escapeHtml(profitPage.sku)}；导出将只包含该 SKU。`:''}</p>`;if(!items.length){const empty=total>0?'<div class="empty">本页没有订单行，请回到第一页</div>':(profitPage.sku?`<div class="empty">没有匹配「${escapeHtml(profitPage.sku)}」的订单行</div>`:'<div class="empty">窗口内没有订单行</div>');node.innerHTML=head+pager+empty+note;bindProfitExport(node);bindProfitPager(node);return;}const rows=items.map(item=>{const cls=item.profit===null?'':(Number(item.profit)>0?'num-gain':'num-loss');const profit=item.profit===null?`<span class="tag warn">${item.cost_status==='unmapped'?'未映射 SKU':'缺成本'}</span>`:escapeHtml(item.profit);return `<tr><td>${escapeHtml(item.external_order_no)}</td><td>${escapeHtml(item.sku_code||item.external_sku||'—')}</td><td class="num">${escapeHtml(item.net_qty)}</td><td class="num">${escapeHtml(item.net_revenue)}</td><td class="num">${escapeHtml(item.cost)}</td><td class="num">${escapeHtml(item.platform_fee)}</td><td class="num ${cls}">${profit}</td></tr>`;}).join('');node.innerHTML=head+pager+`<div class="table-wrap"><table class="profit-table"><thead><tr><th>订单号</th><th>SKU</th><th class="num">净数量</th><th class="num">实付净额</th><th class="num">成本</th><th class="num">平台费</th><th class="num">利润</th></tr></thead><tbody>${rows}</tbody></table></div>`+note;bindProfitExport(node);bindProfitPager(node);}
function bindProfitPager(node){node.querySelectorAll('[data-pager]').forEach(button=>{button.onclick=()=>{const action=button.dataset.pager;if(action==='prev')profitPage.offset=Math.max(0,profitPage.offset-profitPage.limit);else if(action==='next')profitPage.offset=profitPage.offset+profitPage.limit;else if(action==='filter'){profitPage.sku=(node.querySelector('#profit-line-sku')?.value||'').trim();profitPage.offset=0;}else if(action==='clear'){profitPage.sku='';profitPage.offset=0;}void loadProfitDetail();};});const sizeNode=node.querySelector('#profit-line-size');if(sizeNode)sizeNode.onchange=()=>{profitPage.limit=Number(sizeNode.value)||50;profitPage.offset=0;void loadProfitDetail();};const skuNode=node.querySelector('#profit-line-sku');if(skuNode)skuNode.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();profitPage.sku=(skuNode.value||'').trim();profitPage.offset=0;void loadProfitDetail();}};}
function bindProfitExport(node){node.querySelectorAll('[data-profit-export]').forEach(button=>{button.onclick=()=>exportProfitLines(button.dataset.profitExport);});}
async function exportProfitLines(format){try{const days=Number($('#days').value||7);const params=new URLSearchParams({days:String(days),format:String(format)});if(profitPage.sku)params.set('sku_code',profitPage.sku);const response=await fetch(`/api/finance/profit/lines/export?${params.toString()}`,{credentials:'same-origin'});if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.detail?.message||'导出失败');}const blob=await response.blob();const disposition=response.headers.get('Content-Disposition')||'';const hit=/filename="([^"]+)"/.exec(disposition);const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=hit?hit[1]:`profit-lines.${format}`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);const count=response.headers.get('X-Export-Row-Count');if(response.headers.get('X-Export-Truncated')==='1'){const scope=profitPage.sku?`「${profitPage.sku}」`:'全窗口';toast.warning(`已导出${scope}的前 ${count} 行，请缩小时间窗口或筛选条件`);}else{toast.success(profitPage.sku?`已导出「${profitPage.sku}」的全部 ${count} 行（不受分页限制）`:`已导出全窗口 ${count} 行（不受分页限制）`);}}catch(error){toast.error(`导出失败：${error.message||'网络错误'}`);}}
async function load(){const sequence=++requestSequence;showSkeleton();clearError();message.className='status-line';message.textContent='正在加载经营驾驶舱…';try{const days=Number($('#days').value||7);const response=await fetch(`/api/dashboard/cockpit?days=${encodeURIComponent(days)}`,{credentials:'same-origin'});const data=await response.json();if(sequence!==requestSequence)return;if(!response.ok)throw new Error(data.detail?.message||'驾驶舱数据加载失败');body=data;if(data.fx_todo){console.debug('[cockpit] fx_todo:',data.fx_todo);}renderKpis();renderSalesTrend();renderInventoryPie();renderProfit();renderShortage();renderOverstock();renderPurchase();renderInbound();const detail=$('#profit-detail');if(detail){detail.hidden=true;detail.innerHTML='';}profitPage.offset=0;profitPage.sku='';profitPage.total=0;profitSeq++;void loadProfitTrend();message.textContent=`统计截至 ${data.meta?.as_of||'未知'}（${data.meta?.timezone||'UTC'}）· 窗口 ${data.meta?.from||'?'} ~ ${data.meta?.to||'?'} · 来源：当前 Workspace 事实层`;firstLoad=false;}catch(error){if(sequence!==requestSequence)return;disposeCharts();body=null;$('#kpi-grid').innerHTML='';$('#cockpit-sales-meta').textContent='加载失败';$('#cockpit-inventory-meta').textContent='加载失败';chartEmpty('#sales-chart','驾驶舱数据加载失败，请点击「重试」重新加载');chartEmpty('#inventory-pie','驾驶舱数据加载失败，请点击「重试」重新加载');chartEmpty('#profit-trend-chart','驾驶舱数据加载失败，请点击「重试」重新加载');$('#cockpit-profit-trend-meta').textContent='加载失败';showError(error.message||'网络错误');message.className='status-line error';message.textContent=`加载失败：${error.message||'网络错误'}`;firstLoad=false;}}
async function loadProfitTrend(){const seq=++profitTrendSeq;try{const days=Number($('#days').value||7);const response=await fetch(`/api/finance/profit/trend?days=${encodeURIComponent(days)}&points=6`,{credentials:'same-origin'});if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.detail?.message||'利润趋势加载失败');}const data=await response.json();if(seq!==profitTrendSeq)return;renderProfitTrend(data);}catch(error){if(seq!==profitTrendSeq)return;if(profitTrendChart){profitTrendChart.dispose();profitTrendChart=null;}chartEmpty('#profit-trend-chart','利润趋势暂时不可用');const meta=$('#cockpit-profit-trend-meta');if(meta)meta.textContent='加载失败';}}
function renderProfitTrend(data){const node=$('#profit-trend-chart');const meta=$('#cockpit-profit-trend-meta');const note=$('#profit-trend-note');const points=Array.isArray(data.points)?data.points:[];const days=Number(data.days||7);if(profitTrendChart){profitTrendChart.dispose();profitTrendChart=null;}if(note)note.textContent=`每期为 ${days} 天，与上方 KPI 卡「利润环比」同一口径；缺失期断开表示该期无可计算行，不等于利润为 0。`;if(data.multi_currency){chartEmpty('#profit-trend-chart','多币种无法折算单一趋势（与利润环比同一口径）');if(meta)meta.textContent='多币种';return;}if(!points.length||points.every(point=>point.profit===null||point.profit===undefined)){chartEmpty('#profit-trend-chart','所选窗口内没有可计算利润的订单行');if(meta)meta.textContent='暂无数据';return;}node.innerHTML='';const labels=points.map(point=>point.label);const values=points.map(point=>point.profit===null||point.profit===undefined?null:Number(point.profit));profitTrendChart=echarts.init(node,'wb');profitTrendChart.setOption({animation:false,grid:{left:64,right:24,top:28,bottom:32},tooltip:{trigger:'axis',valueFormatter:value=>value==null?'数据缺失':value},xAxis:{type:'category',data:labels},yAxis:{type:'value',name:data.currency||'利润'},series:[{name:'利润',type:'line',data:values,smooth:false,connectNulls:false,symbol:'circle',symbolSize:7,lineStyle:{width:2,color:colors.blue},itemStyle:{color:colors.blue}}]});if(meta)meta.textContent=`${points.length} 期 · 每期 ${days} 天`;}
$('#days').onchange=load;$('#inventory-filter').onchange=renderShortage;$('#clear-filter').onclick=()=>{$('#inventory-filter').value='';renderShortage();};$('#refresh').onclick=load;$('#cockpit-retry').onclick=load;$('#logout').onclick=async()=>{await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':decodeURIComponent(document.cookie.split('; ').find(value=>value.startsWith('dianshang_csrf='))?.split('=').slice(1).join('=')||'')}});location.href='/login';};window.addEventListener('resize',()=>{salesChart?.resize();inventoryChart?.resize();profitTrendChart?.resize();});load();
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>经营驾驶舱</title><link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/workspace-shell.css">
<link rel="stylesheet" href="/static/css/ui-v2.css"><script src="/static/toast.js?v=20261102" defer></script>
<style>body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-sans)}.sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:232px;height:100vh;overflow-y:auto;padding:1.35rem 1rem;background:var(--color-nav-bg);color:var(--color-text-inverse)}.brand-mark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.55rem;background:var(--brand);color:var(--color-on-primary)}.nav a:hover,.nav a.active{background:var(--color-nav-overlay);color:var(--color-on-primary)}.main{min-width:0;margin-left:232px}.topbar{height:4.3rem;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:var(--panel);border-bottom:1px solid var(--line)}.top-actions{display:flex;align-items:center;gap:.8rem;font-size:.86rem}.avatar{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700}.content{max-width:1440px;margin:0 auto;padding:1.65rem 2rem 3rem}.muted{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:.65rem;margin-bottom:1.1rem}.field{display:flex;flex-direction:column;gap:.28rem;font-size:.78rem;color:var(--muted)}select,input,button{min-height:2.35rem;padding:.48rem .7rem;border:1px solid var(--color-border-input);border-radius:.45rem;background:var(--color-surface);color:var(--ink);font:inherit}button:hover{filter:brightness(.96)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85rem}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;box-shadow:var(--shadow)}.card-label{color:var(--muted);font-size:.78rem}.card-value{margin-top:.35rem;font-size:2.4rem;line-height:1.15;font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.card-unit{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:.25rem}.card-change{margin-top:.3rem;font-size:.8rem;color:var(--ink)}.card-note{margin-top:.3rem;font-size:.75rem;color:var(--muted)}.card details{margin-top:.5rem;font-size:.75rem;color:var(--muted)}.card details summary{cursor:pointer;color:var(--brand)}.card-quality{display:inline-block;margin-top:.4rem;padding:.16rem .45rem;border-radius:999px;background:var(--neutral-200);font-size:.7rem;color:var(--color-text-subtle)}.card-quality.partial{background:var(--color-warning-soft);color:var(--color-warning-strong)}.card-quality.complete{background:var(--color-success-soft);color:var(--color-success-strong)}.chart-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:1rem}.chart{height:320px;min-height:260px;position:relative}.chart-empty{display:grid;place-items:center;height:100%;padding:1rem;border:1px dashed var(--color-border-input-strong);border-radius:.5rem;color:var(--muted);font-size:.88rem;text-align:center;line-height:1.5}.chart-refreshing{position:absolute;top:.4rem;right:.5rem;padding:.15rem .45rem;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:.72rem}.skeleton{height:100%;border-radius:.5rem;background:linear-gradient(90deg,var(--color-bg-canvas-start),var(--color-bg-canvas-end),var(--color-bg-canvas-start));background-size:200% 100%;animation:sk 1.2s linear infinite}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:.62rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.84rem}th{color:var(--muted);font-size:.75rem;font-weight:650;white-space:nowrap}td{font-variant-numeric:tabular-nums}.tag.good{background:var(--color-success-soft);color:var(--color-success-strong)}.tag.warn{background:var(--color-warning-soft);color:var(--color-warning-strong)}.tag.critical{background:var(--color-danger-soft);color:var(--color-danger-strong)}.tag.info{background:var(--color-primary-soft);color:var(--color-primary-deep)}.tag.insufficient{background:var(--color-bg-muted);color:var(--color-text-subtle)}.empty{padding:1.2rem;text-align:center;border:1px dashed var(--color-border-dashed);border-radius:.5rem;color:var(--muted)}.status-line{min-height:1.35rem;margin:.7rem 0;color:var(--muted);font-size:.82rem}.error-panel{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem;border:1px solid var(--color-danger-border);border-radius:.55rem;background:var(--color-danger-muted);color:var(--color-danger-strong);font-size:.85rem}.todo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.todo-grid .panel{margin-top:0}.metric-definitions{margin-top:1rem;font-size:.78rem;color:var(--muted)}.metric-definitions li{margin:.25rem 0}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-grid{grid-template-columns:1fr}}@media(max-width:1000px){.shell{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:.9rem .65rem}.brand-text,.nav-label,.nav a span{display:none}.brand{justify-content:center}.nav a{justify-content:center}.topbar{padding:0 1rem}.content{padding:1.2rem}}@media(max-width:600px){.shell{display:block}.sidebar{display:none}.topbar{height:3.8rem}.content{padding:.9rem}.page-heading{display:block}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}.card{padding:.75rem}.card-value{font-size:1.7rem}.todo-grid{grid-template-columns:1fr}.toolbar .field{flex:1 1 130px}.chart{height:260px}.panel{padding:.85rem}}
</style></head>
<body><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div class="crumb">Workspace / <strong>经营驾驶舱</strong></div><div class="top-actions"><span class="muted">当前 Workspace 数据</span><button id="logout" type="button">退出登录</button></div></header><div class="content"><div class="page-heading"><div><h1>经营驾驶舱</h1></div><button id="refresh" type="button">刷新数据</button></div><div class="toolbar"><label class="field">统计窗口<select id="days"><option value="7" selected>近 7 天</option><option value="14">近 14 天</option><option value="30">近 30 天</option></select></label><label class="field">库存状态<select id="inventory-filter"><option value="">全部状态</option><option value="out_of_stock">缺货</option><option value="below_reorder">低于补货点</option><option value="overstock">积压</option></select></label><button id="clear-filter" type="button">清除筛选</button></div><p id="message" class="status-line" role="status">正在加载…</p><div id="cockpit-error" class="error-panel" hidden><span id="cockpit-error-text">驾驶舱数据加载失败。</span><button id="cockpit-retry" type="button">重试</button></div><section class="cards" id="kpi-grid" aria-label="关键指标"></section><div class="chart-grid"><section class="panel" id="cockpit-sales-panel"><div class="panel-head"><div><h2>销售趋势</h2></div><span class="tag" id="cockpit-sales-meta">等待数据</span></div><div id="sales-chart" class="chart"></div></section><section class="panel" id="cockpit-inventory-panel"><div class="panel-head"><div><h2>库存分布</h2></div><span class="tag" id="cockpit-inventory-meta">等待数据</span></div><div id="inventory-pie" class="chart"></div><p id="unknown-policy-note" class="panel-subtitle"></p></section></div><div class="todo-grid"><section class="panel" id="cockpit-shortage-panel"><div class="panel-head"><div><h2>缺货与补货待办</h2></div><span class="tag" id="cockpit-shortage-meta">等待数据</span></div><div id="todo-shortage" class="table-wrap"></div></section><section class="panel" id="cockpit-overstock-panel"><div class="panel-head"><div><h2>积压与滞销待办</h2></div><span class="tag" id="cockpit-overstock-meta">等待数据</span></div><div id="todo-overstock" class="table-wrap"></div></section><section class="panel" id="cockpit-purchase-panel"><div class="panel-head"><div><h2>采购待审批</h2></div><span class="tag" id="cockpit-purchase-meta">等待数据</span></div><div id="todo-purchase" class="table-wrap"></div></section><section class="panel" id="cockpit-inbound-panel"><div class="panel-head"><div><h2>未完成入库</h2></div><span class="tag" id="cockpit-inbound-meta">等待数据</span></div><div id="todo-inbound" class="table-wrap"></div></section></div></div></main></div><script src="/static/echarts.min.js"></script><script src="/static/echarts-theme.js?v=20261102"></script><script>
const $=s=>document.querySelector(s);
const message=$('#message');
const colors={blue:'#2a78d6',orange:'#d58b00',aqua:'#1baf7a',purple:'#8b5cf6',ink:'#142033'};
const distributionColors={out_of_stock:colors.critical,below_reorder:colors.warning,healthy:colors.aqua,overstock:colors.blue};
const distributionLabels={out_of_stock:'缺货',below_reorder:'低于补货点',healthy:'健康',overstock:'积压'};
const qualityLabels={complete:'数据完整',partial:'部分覆盖',insufficient:'数据不足'};
const qualityReasons={NO_ORDER_FACTS:'窗口内无订单事实',PARTIAL_DATA_COMPLETENESS:'部分订单数据不完整',NO_INVENTORY_FACTS:'无库存台账事实',SKU_WITHOUT_POLICY:'部分 SKU 缺库存策略',NO_SALES_FACTS:'近 30 天无销量事实',INCOMPLETE_SALES_COVERAGE:'销量覆盖不完整',NO_PURCHASE_REQUESTS:'无采购单事实',NO_INBOUND_ORDERS:'无入库单事实',NO_DOCUMENTS:'无文档事实'};
const overstockTexts={NO_SALES:'因近 30 天无销量滞销',SLOW_MOVING:'预计可售超 90 天'};
let body=null,requestSequence=0,salesChart=null,inventoryChart=null,firstLoad=true;

function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function chartEmpty(id,text){const node=$(id);if(!node)return;node.innerHTML=`<div class="chart-empty">${escapeHtml(text)}</div>`;}
function disposeCharts(){if(salesChart){salesChart.dispose();salesChart=null;}if(inventoryChart){inventoryChart.dispose();inventoryChart=null;}}
function formatChange(ratio){if(ratio===null||ratio===undefined)return '上一窗口无基数，无法计算环比';const percent=(Number(ratio)*100).toFixed(1);if(Number(ratio)>0)return `↑ 环比上升 ${percent}%`;if(Number(ratio)<0)return `↓ 环比下降 ${percent}%`;return '— 环比持平';}
function qualityText(card){const label=qualityLabels[card.quality]||card.quality||'数据未知';const reason=qualityReasons[card.reason];return reason?`${label}（${reason}）`:label;}
function renderKpis(){const kpis=body?.kpis||{};const order=['gmv','orders','out_of_stock_skus','overstock_skus','pending_purchase_approvals','knowledge_chunks'];$('#kpi-grid').innerHTML=order.map(key=>{const card=kpis[key];if(!card)return '';const value=card.value===null||card.value===undefined?'—':escapeHtml(card.value);const unit=card.unit?`<span class="card-unit">${escapeHtml(card.unit)}</span>`:'';const change=card.change_ratio!==undefined&&card.change_ratio!==null?`<div class="card-change">${escapeHtml(formatChange(card.change_ratio))}</div>`:'';const quality=card.quality?`<span class="card-quality ${escapeHtml(card.quality)}">${escapeHtml(qualityText(card))}</span>`:'';return `<article class="card"><div class="card-label">${escapeHtml(card.label||key)}</div><div class="card-value">${value}${unit}</div>${change}${quality}</article>`;}).join('');}
function renderSalesTrend(){const node=$('#sales-chart');const trend=body?.sales_trend;const dates=trend?.dates||[];const gmvByCurrency=trend?.gmv_by_currency||{};const currencies=Object.keys(gmvByCurrency);const orderCounts=trend?.order_counts||[];const daysWithData=trend?.days_with_data||[];const hasData=dates.length>0&&(currencies.some(currency=>(gmvByCurrency[currency]||[]).some(value=>value!==null&&value!==undefined))||orderCounts.some(count=>Number(count)>0)||daysWithData.some(Boolean));if(salesChart){salesChart.dispose();salesChart=null;}if(!hasData){chartEmpty('#sales-chart','当前 Workspace 无订单事实，暂无可绘制的销售趋势（demo 环境未生成订单，请先在 Shopify 页同步订单）');$('#cockpit-sales-meta').textContent=trend?.missing_days?`缺失 ${trend.missing_days} 天`:'暂无数据';return;}const orderBars=orderCounts.map((count,index)=>daysWithData[index]===false?null:count);const series=currencies.map((currency,index)=>({name:`GMV（${currency}）`,type:'line',yAxisIndex:0,data:gmvByCurrency[currency]||[],smooth:false,connectNulls:false,symbol:'circle',symbolSize:7,lineStyle:{width:2,color:[colors.blue,colors.orange,colors.purple,colors.aqua][index%4]},itemStyle:{color:[colors.blue,colors.orange,colors.purple,colors.aqua][index%4]},areaStyle:index===0&&currencies.length===1?{color:'rgba(42,120,214,.10)'}:undefined}));series.push({name:'订单数',type:'bar',yAxisIndex:1,barMaxWidth:26,data:orderBars,itemStyle:{color:'rgba(213,139,0,.35)',borderRadius:[4,4,0,0]}});salesChart=echarts.init(node,'wb');salesChart.setOption({animation:false,grid:{left:64,right:56,top:28,bottom:38},legend:{data:series.map(item=>item.name),bottom:2},tooltip:{trigger:'axis',valueFormatter:value=>value==null?'数据缺失':value},xAxis:{type:'category',data:dates,axisLabel:{formatter:value=>value.slice(5)}},yAxis:[{type:'value',name:'金额',min:0,},{type:'value',name:'订单数',min:0,splitLine:{show:false}}],series});$('#cockpit-sales-meta').textContent=`${dates.length} 天窗口 · 缺失 ${trend.missing_days||0} 天`;}
function renderInventoryPie(){const node=$('#inventory-pie');const dist=body?.inventory_distribution||{};const keys=Object.keys(distributionLabels);const total=keys.reduce((sum,key)=>sum+(Number(dist[key])||0),0);if(inventoryChart){inventoryChart.dispose();inventoryChart=null;}if(!total){chartEmpty('#inventory-pie','当前 Workspace 无库存策略，无法判定库存分布（请先为 SKU 配置安全库存与补货点）');$('#cockpit-inventory-meta').textContent='暂无数据';$('#unknown-policy-note').textContent='';return;}const data=keys.filter(key=>Number(dist[key])>0).map(key=>({name:distributionLabels[key],value:Number(dist[key])||0,itemStyle:{color:distributionColors[key]}}));inventoryChart=echarts.init(node,'wb');inventoryChart.setOption({animation:false,color:keys.map(key=>distributionColors[key]),tooltip:{trigger:'item',formatter:'{b}：{c} 个 SKU（{d}%）'},legend:{bottom:2},series:[{type:'pie',radius:['42%','68%'],center:['50%','46%'],avoidLabelOverlap:true,label:{formatter:'{b} {c}',color:colors.ink},data}]});$('#cockpit-inventory-meta').textContent=`${total} 个 SKU`;$('#unknown-policy-note').textContent=dist.unknown_policy?`另有 ${dist.unknown_policy} 个 SKU 无库存策略，未计入缺货判定。`:'';}
function statusBadge(status){const map={out_of_stock:['critical','缺货'],below_reorder:['warn','低于补货点'],NO_SALES:['warn','因近 30 天无销量滞销'],SLOW_MOVING:['info','预计可售超 90 天'],expected:['warn','待收货'],received:['info','已收货未确认'],submitted:['info','待审批'],approved:['good','已审批'],rejected:['critical','已驳回'],cancelled:['insufficient','已取消'],draft:['insufficient','草稿'],confirmed:['good','已确认']};const hit=map[status]||['','状态：'+(status||'未知')];return `<span class="tag ${hit[0]}">${escapeHtml(hit[1])}</span>`;}
function renderShortage(){const filter=$('#inventory-filter').value;const items=(body?.todo?.shortage||[]).filter(item=>!filter||item.status===filter);const target=$('#todo-shortage');if(!items.length){target.innerHTML=`<div class="empty">${filter?'当前筛选下没有匹配的缺货 SKU，可点击「清除筛选」查看全部':'当前没有缺货 SKU（on_hand 均高于安全库存）'}</div>`;}else{target.innerHTML=`<table><thead><tr><th>SKU</th><th class="num">库存</th><th class="num">安全库存</th><th class="num">补货点</th><th>状态</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.sku_code||'未命名 SKU')}</td><td class="num">${escapeHtml(item.on_hand_qty)}</td><td class="num">${escapeHtml(item.safety_stock_qty)}</td><td class="num">${escapeHtml(item.reorder_point_qty)}</td><td>${statusBadge(item.status)}</td></tr>`).join('')}</tbody></table>`;}$('#cockpit-shortage-meta').textContent=`${items.length} 条`;}
function renderOverstock(){const filter=$('#inventory-filter').value;const items=(body?.todo?.overstock||[]).filter(item=>!filter||filter==='overstock');const target=$('#todo-overstock');if(!items.length){target.innerHTML='<div class="empty">当前没有积压 SKU（近 30 天有销量且可售天数未超阈值）</div>';}else{target.innerHTML=`<table><thead><tr><th>SKU</th><th class="num">库存</th><th class="num">日均销量</th><th class="num">可售天数</th><th>原因</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.sku_code||'未命名 SKU')}</td><td class="num">${escapeHtml(item.on_hand_qty)}</td><td class="num">${item.avg_daily_qty===null||item.avg_daily_qty===undefined?'—':escapeHtml(item.avg_daily_qty)}</td><td class="num">${item.days_of_inventory===null||item.days_of_inventory===undefined?'—':escapeHtml(item.days_of_inventory)}</td><td><span class="tag warn">${escapeHtml(overstockTexts[item.reason]||item.reason||'原因未知')}</span></td></tr>`).join('')}</tbody></table>`;}$('#cockpit-overstock-meta').textContent=`${items.length} 条`;}
function renderPurchase(){const items=body?.todo?.purchase_approvals||[];const target=$('#todo-purchase');if(!items.length){target.innerHTML='<div class="empty">当前没有待审批采购单</div>';}else{target.innerHTML=`<table><thead><tr><th>采购单号</th><th class="num">仓库</th><th>状态</th><th>创建时间</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.ref||'—')}</td><td class="num">${escapeHtml(item.warehouse_id??'—')}</td><td>${statusBadge(item.status)}</td><td>${escapeHtml((item.created_at||'').slice(0,19).replace('T',' ')||'—')}</td></tr>`).join('')}</tbody></table>`;}$('#cockpit-purchase-meta').textContent=`${body?.todo?.pending_purchase_count??items.length} 条`;}
function renderInbound(){const items=body?.todo?.pending_inbounds||[];const target=$('#todo-inbound');if(!items.length){target.innerHTML='<div class="empty">当前没有未完成入库单</div>';}else{target.innerHTML=`<table><thead><tr><th>入库单号</th><th class="num">仓库</th><th>状态</th><th>创建时间</th></tr></thead><tbody>${items.map(item=>`<tr><td>${escapeHtml(item.ref||'—')}</td><td class="num">${escapeHtml(item.warehouse_id??'—')}</td><td>${statusBadge(item.status)}</td><td>${escapeHtml((item.created_at||'').slice(0,19).replace('T',' ')||'—')}</td></tr>`).join('')}</tbody></table>`;}$('#cockpit-inbound-meta').textContent=`${body?.todo?.pending_inbound_count??items.length} 条`;}
function showSkeleton(){if(!firstLoad)return;$('#kpi-grid').innerHTML=Array.from({length:6},()=>'<div class="card"><div class="skeleton" style="height:96px"></div></div>').join('');$('#sales-chart').innerHTML='<div class="skeleton"></div>';$('#inventory-pie').innerHTML='<div class="skeleton"></div>';}
function clearError(){$('#cockpit-error').hidden=true;$('#cockpit-error-text').textContent='';}
function showError(text){$('#cockpit-error').hidden=false;$('#cockpit-error-text').textContent=text||'驾驶舱数据加载失败，请稍后重试。';}
async function load(){const sequence=++requestSequence;showSkeleton();clearError();message.className='status-line';message.textContent='正在加载经营驾驶舱…';try{const days=Number($('#days').value||7);const response=await fetch(`/api/dashboard/cockpit?days=${encodeURIComponent(days)}`,{credentials:'same-origin'});const data=await response.json();if(sequence!==requestSequence)return;if(!response.ok)throw new Error(data.detail?.message||'驾驶舱数据加载失败');body=data;if(data.fx_todo){console.debug('[cockpit] fx_todo:',data.fx_todo);}renderKpis();renderSalesTrend();renderInventoryPie();renderShortage();renderOverstock();renderPurchase();renderInbound();message.textContent=`统计截至 ${data.meta?.as_of||'未知'}（${data.meta?.timezone||'UTC'}）· 窗口 ${data.meta?.from||'?'} ~ ${data.meta?.to||'?'} · 来源：当前 Workspace 事实层`;firstLoad=false;}catch(error){if(sequence!==requestSequence)return;disposeCharts();body=null;$('#kpi-grid').innerHTML='';$('#cockpit-sales-meta').textContent='加载失败';$('#cockpit-inventory-meta').textContent='加载失败';chartEmpty('#sales-chart','驾驶舱数据加载失败，请点击「重试」重新加载');chartEmpty('#inventory-pie','驾驶舱数据加载失败，请点击「重试」重新加载');showError(error.message||'网络错误');message.className='status-line error';message.textContent=`加载失败：${error.message||'网络错误'}`;firstLoad=false;}}
$('#days').onchange=load;$('#inventory-filter').onchange=renderShortage;$('#clear-filter').onclick=()=>{$('#inventory-filter').value='';renderShortage();};$('#refresh').onclick=load;$('#cockpit-retry').onclick=load;$('#logout').onclick=async()=>{await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':decodeURIComponent(document.cookie.split('; ').find(value=>value.startsWith('dianshang_csrf='))?.split('=').slice(1).join('=')||'')}});location.href='/login';};window.addEventListener('resize',()=>{salesChart?.resize();inventoryChart?.resize();});load();
</script></body></html>

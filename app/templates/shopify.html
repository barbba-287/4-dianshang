<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shopify 接入</title><link rel="stylesheet" href="/static/workspace-shell.css"><style> .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem}.card,.panel{background:#fff;border:1px solid #e4eaf2;border-radius:.7rem;padding:1rem;margin-top:1rem}.card-value{font-size:1.5rem;font-weight:700}.muted{color:#69778b;font-size:.82rem}.tag{display:inline-block;padding:.25rem .55rem;border-radius:99px;background:#edf2f7;font-size:.75rem}.good{background:#e9f7ec;color:#14751a}.warn{background:#fff4d6;color:#946500}.error{color:#a72727}button{padding:.55rem .8rem;border:0;border-radius:.45rem;background:#2a78d6;color:#fff;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:.65rem;border-bottom:1px solid #e4eaf2;text-align:left;font-size:.82rem}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div class="muted">Workspace / <strong>Shopify 只读接入</strong></div><button id="logout">退出登录</button></header><div class="content"><div class="page-heading"><div><h1>Shopify 只读接入</h1><p class="muted">真实开发店数据预览；当前不执行 Shopify mutation，不写回平台库存或订单。</p></div><div><button id="sync">同步到外部事实层</button> <button id="refresh">刷新真实数据</button></div></div><p id="sync-status" class="muted"></p><p id="status" class="muted">正在读取连接状态…</p><div id="cards" class="cards"></div><section class="panel"><h2>商品预览</h2><div id="products" class="table-wrap"></div></section><section class="panel"><h2>库存预览</h2><div id="inventory" class="table-wrap"></div></section><section class="panel"><h2>订单预览</h2><div id="orders" class="table-wrap"></div></section></div></main></div><script>const $=s=>document.querySelector(s);function token(){const x=document.cookie.split('; ').find(v=>v.startsWith('dianshang_csrf='));return x?decodeURIComponent(x.split('=').slice(1).join('=')):'';}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}async function api(path,opt={}){const r=await fetch(path,{...opt,credentials:'same-origin',headers:{'X-CSRF-Token':token(),...(opt.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail?.message||'请求失败');return b;}function table(headers,rows,empty='暂无数据'){if(!rows.length)return `<div class="muted">${empty}</div>`;return `<table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}async function load(){const status=$('#status');status.className='muted';status.textContent='正在读取 Shopify 真实数据…';try{const cap=await api('/api/external/shopify/capabilities');const [products,inventory,orders]=await Promise.all(['products','inventory','orders'].map(resource=>api('/api/external/shopify/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource,live:true})})));$('#cards').innerHTML=[['店铺',cap.store_domain||'未配置'],['连接',cap.live_enabled?'已启用':'未启用'],['商品',products.total],['库存',inventory.total],['订单',orders.total]].map(([l,v])=>`<div class="card"><div class="muted">${esc(l)}</div><div class="card-value">${esc(v)}</div></div>`).join('');const productRows=products.records.flatMap(p=>(p.variants?.nodes||[]).map(v=>[p.title,v.sku||'无 SKU',v.price||'—',p.id]));$('#products').innerHTML=table(['商品','SKU','价格','Shopify Product GID'],productRows,'Shopify 没有返回商品');const invRows=inventory.records.flatMap(item=>(item.inventoryLevels?.edges||[]).map(edge=>[item.sku||item.id,edge.node?.location?.id||'—',edge.node?.quantities?.map(q=>`${q.name}:${q.quantity}`).join('、')||'—']));$('#inventory').innerHTML=table(['SKU/InventoryItem','Location GID','库存数量'],invRows,'Shopify 没有返回库存');const orderRows=orders.records.map(o=>[o.name||o.id,o.createdAt,o.updatedAt,o.displayFinancialStatus||'—',o.displayFulfillmentStatus||'—']);$('#orders').innerHTML=table(['订单','创建时间','更新时间','财务状态','履约状态'],orderRows,'当前开发店没有可读取订单；这不是接口失败');status.innerHTML=`<span class="tag good">真实 Shopify 数据</span>　来源：${esc(products.store_domain||cap.store_domain||'')}　商品/库存/订单均为只读预览`; }catch(e){status.className='error';status.textContent=`读取失败：${e.message}`;}}$('#refresh').onclick=load;$('#sync').onclick=async()=>{const out=$('#sync-status');out.className='muted';out.textContent='正在同步订单与库存到外部事实层…';try{const result=await api('/api/external/shopify/sync?resources=orders,inventory',{method:'POST'});out.innerHTML=`<span class="tag good">同步${esc(result.status||'完成')}</span>　运行 ID：${esc(result.run_id)}　订单 ${esc(result.resources?.orders?.total??0)} 条，库存 ${esc(result.resources?.inventory?.inserted??0)} 条已写入 ExternalInventorySnapshot；不写内部库存台账`;await load();}catch(e){out.className='error';out.textContent=`同步失败：${e.message}`;}};$('#logout').onclick=async()=>{await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':token()}});location.href='/login';};load();</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>商品页生产</title><link rel="stylesheet" href="/static/workspace-shell.css"><script src="/static/labels.js?v=20260915-2"></script><style>
.grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.5fr);gap:1rem}.panel{background:#fff;border:1px solid #e4eaf2;border-radius:.7rem;padding:1.1rem;margin-top:1rem}.field{display:flex;flex-direction:column;gap:.3rem;margin:.65rem 0;color:#69778b;font-size:.8rem}select,input,textarea,button{font:inherit;padding:.55rem .65rem;border:1px solid #ccd7e5;border-radius:.45rem}textarea{min-height:100px;resize:vertical}button{background:#2a78d6;color:#fff;border:0;cursor:pointer}.muted{color:#69778b;font-size:.82rem}.status{min-height:1.4rem}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}.candidate{border:1px solid #e4eaf2;border-radius:.5rem;padding:.5rem}.candidate img{width:100%;aspect-ratio:1;object-fit:contain;background:#f4f7fb}.tag{display:inline-block;padding:.2rem .5rem;border-radius:99px;background:#edf2f7;font-size:.75rem}.workflow-canvas{display:flex;align-items:center;gap:.35rem;overflow-x:auto;padding:.8rem 0}.workflow-node{min-width:112px;padding:.65rem .55rem;text-align:center;border:1px solid #cbd8e8;border-radius:.55rem;background:#f7fafe;font-size:.73rem;color:#29415b}.workflow-arrow{color:#2a78d6;font-weight:700}.workflow-meta{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.5rem 0}.workflow-meta .tag{white-space:normal}.good{background:#e9f7ec;color:#14751a}.warn{background:#fff4d6;color:#946500}.error{color:#a72727}@media(max-width:850px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div class="muted">Workspace / <strong>商品页生产</strong></div><button id="logout" type="button">退出登录</button></header><div class="content"><div class="page-heading"><div><h1>AIGC 商品页生产</h1><p class="muted">基础商品图优化 + 上架文案 + 人工审核。当前页面支持本地可复现 Provider；万相需显式配置。</p></div></div><div class="grid"><section class="panel"><h2>创建生产任务</h2><label class="field">商品<select id="product"><option value="">正在加载商品…</option></select></label><label class="field">商品基础图<input id="source-image" type="file" accept="image/jpeg,image/png,image/webp,image/bmp"><button id="upload-source" type="button">上传基础图</button><span id="media-status" class="muted">基础图按商品绑定，SKU 可选，不要求 SKU 自带图片。</span></label><div id="source-preview-wrap" hidden><img id="source-preview" alt="商品基础图预览" style="width:100%;max-height:220px;object-fit:contain;border:1px solid #e4eaf2;border-radius:.5rem;background:#f4f7fb"></div><label class="field">场景<select id="scene"><option>电商主图优化</option><option>详情页首图</option><option>活动 Banner</option></select></label><label class="field">品类工作流<select id="workflow"><option value="package_preserve">包装保真型 v1 · 茶饮/食品/美妆</option><option value="scene_extend">场景延展型 v1 · 家居/3C</option><option value="model_atmosphere">模特/氛围型 v1 · 服装/配饰</option></select></label><div id="workflow-plan" class="workflow-meta"></div><div id="workflow-canvas" class="workflow-canvas" aria-label="可视化工作流节点"></div><label class="field">风格<select id="style"><option>清新自然</option><option>高级简约</option><option>节日促销</option></select></label><label class="field">图片 Provider<select id="provider"><option value="local">Local Compositor（本地预览，不是真实生图）</option><option value="wan">阿里云万相（真实 API）</option></select></label><label class="field">候选图片数量<select id="candidate-count"><option value="1">1 张（调试/省费用）</option><option value="2">2 张</option><option value="3" selected>3 张</option><option value="4">4 张</option></select></label><label class="field">运营 Brief<textarea id="brief" placeholder="例如：生成清晨茶席背景，商品主体保持原图，右侧留出标题区域"></textarea></label><button id="generate" type="button">生成商品页素材</button><p id="form-status" class="status muted"></p></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>任务与审核</h2><button id="refresh-runs" type="button">刷新历史任务</button></div><div id="run-history" class="muted">正在加载历史任务…</div><div id="run-status" class="status muted">尚未创建任务</div><div id="result"></div></section></div></div></main></div><script>
const $=s=>document.querySelector(s);let poll=null;let workflows={};let currentJobId=null;function token(){const x=document.cookie.split('; ').find(v=>v.startsWith('dianshang_csrf='));return x?decodeURIComponent(x.split('=').slice(1).join('=')):'';}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function jobLabel(v){return ({queued:'排队中',running:'生成中',retry_wait:'等待重试',succeeded:'已完成',failed:'失败',cancelled:'已取消'}[v]||v||'未知');}function revisionLabel(v){return ({generating:'生成中',draft:'草稿',in_review:'审核中',approved:'已通过',rejected:'已驳回',changes_requested:'待修改',generation_failed:'生成失败',quality_failed:'质量检查失败'}[v]||v||'未知');}function providerLabel(v){return ({wan:'万相',local_compositor:'本地合成',mock:'模拟',local:'本地合成'}[v]||v||'未知');}function renderWorkflow(){const w=workflows[$('#workflow').value];if(!w)return;$('#workflow-plan').innerHTML=`<span class="tag">${esc(w.label)} · ${esc(w.workflow_version)}</span><span class="tag">主体保真：${w.preserve_text?'是':'结构检查'}</span><span class="tag">质量门禁：${esc((w.quality_checks||[]).join('、'))}</span>`;$('#workflow-canvas').innerHTML=(w.stages||[]).map((stage,i)=>`${i?'<span class="workflow-arrow">→</span>':''}<span class="workflow-node">${esc({source_snapshot:'商品事实快照',foreground_cutout:'主体抠图',source_geometry_check:'结构检查',ai_background_generation:'AI背景/场景',deterministic_post_process:'后处理排版',category_quality_gate:'品类质量门禁',human_review:'人工审核',export:'导出'}[stage]||stage)}</span>`).join('');}
async function uploadSource(){const product=$('#product').value;const file=$('#source-image').files[0];const status=$('#media-status');if(!product||!file){status.textContent='请先选择商品和基础图';return;}const form=new FormData();form.append('file',file);$('#upload-source').disabled=true;status.textContent='正在上传基础图…';try{const result=await api(`/api/products/${product}/media`,{method:'POST',body:form});status.textContent=`已绑定当前商品：${result.width}×${result.height} · SHA ${result.content_sha256.slice(0,12)}…`;$('#source-preview').src=URL.createObjectURL(file);$('#source-preview-wrap').hidden=false;}catch(error){status.textContent=error.message||'基础图上传失败';status.className='muted error';}finally{$('#upload-source').disabled=false;}}
async function loadHistory(){try{const b=await api('/api/content/runs?limit=20');const rows=b.items||[];$('#run-history').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>版本</th><th>任务</th><th>Provider</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>商品 #${x.product_id} · v${x.revision_no}</td><td>${esc(x.job_id||'—')}</td><td>${esc(providerLabel(x.provider))}${x.simulated?'（模拟）':'（真实）'}</td><td>${esc(jobLabel(x.job_status))} / ${esc(revisionLabel(x.status))}</td><td>${esc(x.created_at||'')}</td><td>${x.job_id?`<button type="button" class="load-run" data-job="${x.job_id}">查看</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'暂无历史任务';document.querySelectorAll('.load-run').forEach(b=>b.onclick=async()=>{currentJobId=Number(b.dataset.job);const d=await api(`/api/content/runs/${currentJobId}`);render(d);$('#run-status').textContent=`已加载历史任务 #${currentJobId}`;});}catch(e){$('#run-history').textContent=e.message||'历史任务加载失败';}}
async function loadExistingSource(){const product=$('#product').value;if(!product)return;try{const rows=await api(`/api/products/${product}/media`);const source=rows.find(x=>x.role==='source');if(source){$('#media-status').textContent=`已绑定基础图：${source.width}×${source.height} · SHA ${source.content_sha256.slice(0,12)}…`;$('#source-preview').src=`/api/content/assets/${source.id}`;$('#source-preview-wrap').hidden=false;}else{$('#media-status').textContent='当前商品还没有基础图；SKU 可选，不要求 SKU 自带图片。';$('#source-preview-wrap').hidden=true;}}catch(e){$('#media-status').textContent=e.message||'基础图状态加载失败';}}
async function api(url,opt={}){const headers={'X-CSRF-Token':token(),...(opt.headers||{})};const r=await fetch(url,{...opt,credentials:'same-origin',headers});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail?.message||'请求失败');return b;}async function loadProducts(){const b=await api('/api/products?page_size=100');$('#product').innerHTML=b.items.length?b.items.map(p=>`<option value="${p.id}">${esc(p.title)} · ${esc(p.category||'')}</option>`).join(''):'<option value="">暂无商品，请先采集</option>';await loadExistingSource();}async function loadWorkflows(){const b=await api('/api/content/workflows');workflows=Object.fromEntries(b.items.map(x=>[x.workflow_key,x]));renderWorkflow();}function render(data){const c=data.revision?.content_json?JSON.parse(data.revision.content_json):null;const assets=data.revision?.assets||[];const issues=data.revision?.quality_issues_json?JSON.parse(data.revision.quality_issues_json):[];$('#result').innerHTML=`<p><span class="tag">${esc(providerLabel(data.provider||''))}</span> <span class="tag ${data.simulated?'warn':'good'}">${data.simulated?'模拟 Provider':'真实 Provider'}</span> <span class="tag">${esc(jobLabel(data.job_status||''))} · ${esc(revisionLabel(data.revision?.status||''))}</span></p>${data.revision?.status==='generation_failed'?`<div class="error">生成失败：${esc(issues.map(x=>x.message||x.code).join('；')||'请查看任务日志')}</div>`:''}${c?`<h3>${esc(c.title)}</h3><p>${esc(c.detail_sections?.[0]?.body||'')}</p><h4>卖点</h4><ul>${(c.selling_points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="cards">${assets.map(a=>`<div class="candidate"><img src="/api/content/assets/${a.id}" alt="候选图"><small>候选 #${a.id} · ${esc(a.content_sha256.slice(0,12))}</small></div>`).join('')}</div><p class="muted">来源快照：${esc(data.revision?.source_snapshot_hash||'')} · ${data.revision?.quality_status==='passed'?'质量检查通过':'待检查'}</p>${data.revision?.status==='draft'?'<button id="submit-review" type="button">提交人工审核</button>':''}${data.revision?.status==='in_review'?'<button id="approve-review" type="button">审核通过</button><button id="reject-review" type="button">驳回</button>':''}`;const btn=$('#submit-review');if(btn)btn.onclick=()=>review(data.revision.id,'submit',data.revision.version);const approve=$('#approve-review');if(approve)approve.onclick=()=>review(data.revision.id,'approve',data.revision.version);const reject=$('#reject-review');if(reject)reject.onclick=()=>review(data.revision.id,'reject',data.revision.version);}async function review(id,action,version){try{const note=action==='reject'?prompt('请输入驳回原因')||'运营驳回':action==='approve'?'运营审核通过':'提交人工审核';const b=await api(`/api/content/revisions/${id}/review`,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':`review-${id}-${action}-${version}`},body:JSON.stringify({action,note,expected_version:version})});$('#run-status').textContent=`审核动作已记录：${action==='submit'?'已提交人工审核':action==='approve'?'已审核通过':'已驳回'}；当前状态：${b.status}`;const d=await api(`/api/content/runs/${window.currentJobId}`);render(d);loadHistory();}catch(e){$('#run-status').textContent=e.message;$('#run-status').className='status error';}}async function pollRun(jobId){try{const b=await api(`/api/content/jobs/${jobId}`);$('#run-status').textContent=`任务状态：${jobLabel(b.job_status)} · 版本：${revisionLabel(b.revision_status)}`;if(['succeeded','failed','cancelled'].includes(b.job_status)){clearInterval(poll);const d=await api(`/api/content/runs/${jobId}`);render(d);} }catch(e){clearInterval(poll);$('#run-status').textContent=e.message;}}$('#upload-source').onclick=uploadSource;$('#product').onchange=loadExistingSource;$('#refresh-runs').onclick=loadHistory;$('#generate').onclick=async()=>{const btn=$('#generate');btn.disabled=true;$('#form-status').textContent='正在提交…';try{const b=await api('/api/content/runs',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':`content-${Date.now()}`},body:JSON.stringify({product_id:Number($('#product').value),scene:$('#scene').value,style:$('#style').value,provider:$('#provider').value,brief:$('#brief').value,workflow_key:$('#workflow').value,candidate_count:Number($('#candidate-count').value)})});$('#run-status').textContent='任务已入队';poll=setInterval(()=>pollRun(b.job_id),500);await pollRun(b.job_id);}catch(e){$('#form-status').textContent=e.message;$('#form-status').className='status error';}finally{btn.disabled=false;}};$('#logout').onclick=async()=>{await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':token()}});location.href='/login';};$('#workflow').onchange=renderWorkflow;Promise.all([loadProducts(),loadWorkflows(),loadHistory()]).catch(e=>$('#form-status').textContent=e.message);
</script></body></html>

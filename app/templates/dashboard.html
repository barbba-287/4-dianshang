<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>运营驾驶舱</title><link rel="stylesheet" href="/static/workspace-shell.css">
<style>
:root{color-scheme:light;--page:#f4f7fb;--panel:#fff;--ink:#142033;--muted:#69778b;--line:#e4eaf2;--brand:#2a78d6;--brand-soft:#eaf2fc;--good:#0ca30c;--warning:#d58b00;--critical:#d03b3b;--shadow:0 8px 24px #1e3a5f0d}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.sidebar{padding:1.35rem 1rem;background:#14243a;color:#dbe7f5}.brand{display:flex;align-items:center;gap:.7rem;font-weight:750;font-size:1.05rem;margin-bottom:2rem}.brand-mark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.55rem;background:var(--brand);color:#fff}.nav-label{margin:1.25rem .75rem .45rem;color:#8fa5bf;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.nav a{display:flex;align-items:center;gap:.65rem;padding:.7rem .75rem;border-radius:.55rem;color:#c4d2e3;font-size:.9rem}.nav a:hover,.nav a.active{background:#ffffff14;color:#fff}.main{min-width:0}.topbar{height:4.3rem;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:var(--panel);border-bottom:1px solid var(--line)}.crumb{font-size:.86rem;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:.8rem;font-size:.86rem}.avatar{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700}.content{max-width:1440px;margin:0 auto;padding:1.65rem 2rem 3rem}.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.2rem}.page-heading h1{margin:0;font-size:1.55rem;letter-spacing:-.02em}.muted{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:.65rem;margin-bottom:1.1rem}.field{display:flex;flex-direction:column;gap:.28rem;font-size:.78rem;color:var(--muted)}select,input,button{min-height:2.35rem;padding:.48rem .7rem;border:1px solid #ccd7e5;border-radius:.45rem;background:#fff;color:var(--ink);font:inherit}button{border:0;background:var(--brand);color:#fff;cursor:pointer}button:hover{filter:brightness(.96)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.85rem}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;box-shadow:var(--shadow)}.card{padding:1rem}.card-label{color:var(--muted);font-size:.78rem}.card-value{margin-top:.35rem;font-size:1.45rem;font-weight:720;font-variant-numeric:tabular-nums}.card-note{margin-top:.25rem;font-size:.75rem;color:var(--muted)}.panel{padding:1.15rem;margin-top:1rem}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.9rem}.panel h2{margin:0;font-size:1rem}.panel-subtitle{margin:.25rem 0 0;color:var(--muted);font-size:.78rem}.chart-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:1rem}.chart{height:300px;min-height:240px}.chart-empty{display:grid;place-items:center;height:100%;border:1px dashed #cbd7e5;border-radius:.5rem;color:var(--muted);font-size:.88rem}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:.68rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.84rem}th{color:var(--muted);font-size:.75rem;font-weight:650;white-space:nowrap}td{font-variant-numeric:tabular-nums}.tag{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .48rem;border-radius:999px;background:#edf2f7;font-size:.72rem}.tag.good{background:#e9f7ec;color:#14751a}.tag.warn{background:#fff4d6;color:#946500}.tag.critical{background:#fde9e9;color:#a72727}.tag.insufficient{background:#edf0f4;color:#687589}.empty{padding:1.2rem;text-align:center;border:1px dashed #cad6e5;border-radius:.5rem;color:var(--muted)}.status-line{min-height:1.35rem;margin:.7rem 0;color:var(--muted);font-size:.82rem}.error{color:#a72727}@media(max-width:1000px){.shell{grid-template-columns:76px minmax(0,1fr)}.sidebar{padding:.9rem .65rem}.brand-text,.nav-label,.nav a span{display:none}.brand{justify-content:center}.nav a{justify-content:center}.topbar{padding:0 1rem}.content{padding:1.2rem}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-grid{grid-template-columns:1fr}}@media(max-width:600px){.shell{display:block}.sidebar{display:none}.topbar{height:3.8rem}.content{padding:.9rem}.page-heading{display:block}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}.card{padding:.75rem}.card-value{font-size:1.2rem}.toolbar .field{flex:1 1 130px}.chart{height:260px}.panel{padding:.85rem}}
</style></head>
<body><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div class="crumb">Workspace / <strong>运营驾驶舱</strong></div><div class="top-actions"><span class="muted">离线 / Mock 数据</span><button id="logout" type="button">退出登录</button></div></header><div class="content"><div class="page-heading"><div><h1>运营驾驶舱</h1><p class="muted">用少量关键视图发现库存风险，再回到明细表处理具体 SKU。</p></div><button id="refresh" type="button">刷新数据</button></div><div class="toolbar"><label class="field">时间范围<select id="days"><option value="7">近 7 天</option><option value="14" selected>近 14 天</option><option value="30">近 30 天</option></select></label><label class="field">仓库<select id="warehouse-filter"><option value="">全部仓库</option></select></label><label class="field">趋势 SKU<select id="sku-filter"><option value="">全部 SKU</option></select></label></div><p id="message" class="status-line" role="status">正在加载…</p><section class="cards" id="kpis"></section><div class="chart-grid"><section class="panel"><div class="panel-head"><div><h2>销量趋势</h2><p class="panel-subtitle">缺失日期保留为空，不将缺失数据伪造为 0。</p></div><span class="tag" id="trend-meta">等待数据</span></div><div id="sales-chart" class="chart"></div></section><section class="panel"><div class="panel-head"><div><h2>库存风险 Top 10</h2><p class="panel-subtitle">按总库存从低到高展示，明细请使用下方表格。</p></div><span class="tag" id="inventory-meta">等待数据</span></div><div id="inventory-chart" class="chart"></div></section></div><section class="panel"><div class="panel-head"><div><h2>SKU 库存健康</h2><p class="panel-subtitle">表格是查找具体 SKU 的主入口，支持搜索和状态筛选。</p></div><input id="sku-search" type="search" placeholder="搜索商品或 SKU" aria-label="搜索商品或 SKU"></div><div class="table-wrap"><table><thead><tr><th>商品 / SKU</th><th>库存</th><th id="sku-sales-heading">近14日销量</th><th>日均</th><th>可售天数</th><th>建议补货</th><th>状态 / 数据完整度</th></tr></thead><tbody id="sku-health"></tbody></table></div></section><section class="panel"><div class="panel-head"><div><h2>异常收件箱</h2><p class="panel-subtitle">告警和同步问题优先用列表处理，不用图表隐藏细节。</p></div></div><div id="alert-details" class="table-wrap"></div></section><section class="panel"><div class="panel-head"><div><h2>最近入库</h2><p class="panel-subtitle">仓库实收后仍需运营确认，确认前不改变内部库存。</p></div></div><div id="inbounds" class="table-wrap"></div></section><section class="panel"><h2>指标口径</h2><p id="limitations" class="muted"></p></section></div></main></div><script src="/static/echarts.min.js"></script><script>
const $=s=>document.querySelector(s);const message=$('#message');const colors={blue:'#2a78d6',orange:'#eb6834',aqua:'#1baf7a',muted:'#898781',line:'#e1e0d9',surface:'#ffffff',ink:'#142033'};let body=null,salesChart=null,inventoryChart=null,requestSequence=0;
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function statusTag(item){const status=item.status||'';const cls=status==='healthy'?'good':status==='urgent'?'critical':status==='reorder'?'warn':status==='data_insufficient'||status==='no_sales'?'insufficient':'';const label={healthy:'健康',reorder:'建议补货',urgent:'紧急',data_insufficient:'数据不足',no_sales:'无销量'}[status]||status;return `<span class="tag ${cls}">${escapeHtml(label)}</span>`;}
function chartEmpty(id,text){$(id).innerHTML=`<div class="chart-empty">${escapeHtml(text)}</div>`;}
function renderSales(){const target=$('#sales-chart');if(salesChart){salesChart.dispose();salesChart=null;}const trend=body?.sales_trend;if(!trend||!trend.dates?.length||!trend.complete_days){chartEmpty('#sales-chart',trend?.missing_days?'当前时间范围数据不足，暂无趋势图':'暂无销量数据');$('#trend-meta').textContent=trend?.missing_days?`缺失 ${trend.missing_days} 天`:'暂无数据';return;}salesChart=echarts.init(target);salesChart.setOption({animation:false,color:[colors.blue],grid:{left:42,right:18,top:18,bottom:34},tooltip:{trigger:'axis',valueFormatter:value=>value==null?'数据缺失':`${value} 件`},xAxis:{type:'category',data:trend.dates,axisLabel:{color:colors.muted,formatter:value=>value.slice(5)}},yAxis:{type:'value',min:0,splitLine:{lineStyle:{color:colors.line}}},series:[{name:'净销量',type:'line',data:trend.values,smooth:false,connectNulls:false,symbol:'circle',symbolSize:8,lineStyle:{width:2,color:colors.blue},itemStyle:{color:colors.blue,borderColor:colors.surface,borderWidth:2},areaStyle:{color:'rgba(42,120,214,.10)'}}]});$('#trend-meta').textContent=`完整 ${trend.complete_days}/${trend.days} 天`;}
function renderInventory(){const target=$('#inventory-chart');if(inventoryChart){inventoryChart.dispose();inventoryChart=null;}const chart=body?.inventory_chart;if(!chart?.skus?.length){chartEmpty('#inventory-chart','暂无库存数据');$('#inventory-meta').textContent='暂无数据';return;}inventoryChart=echarts.init(target);inventoryChart.setOption({animation:false,color:[colors.blue,colors.orange],grid:{left:48,right:18,top:18,bottom:55},tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},legend:{show:chart.warehouses.length>1,bottom:4,textStyle:{color:colors.muted}},xAxis:{type:'category',data:chart.skus,axisLabel:{color:colors.muted,rotate:chart.skus.length>6?28:0}},yAxis:{type:'value',min:0,splitLine:{lineStyle:{color:colors.line}}},series:chart.series.map(item=>({name:item.name,type:'bar',barMaxWidth:24,data:item.values,itemStyle:{borderRadius:[4,4,0,0]}}))});$('#inventory-meta').textContent=`展示 ${chart.skus.length} 个 SKU`;}
function renderKpis(){const labels={product_count:['商品数','当前 Workspace'],active_sku_count:['启用 SKU','可参与运营'],active_warehouse_count:['启用仓库','当前可用仓库'],on_hand_qty:['已确认库存','内部台账数量'],current_in_transit_expected_qty:['当前在途','待收货预计数量']};$('#kpis').innerHTML=Object.entries(labels).map(([key,[label,note]])=>`<div class="card"><div class="card-label">${label}</div><div class="card-value">${escapeHtml(body.kpis?.[key]??0)}</div><div class="card-note">${note}</div></div>`).join('');}
function renderSku(){const query=($('#sku-search').value||'').trim().toLowerCase();const selectedDays=String(body?.range?.days||14);const rows=(body.sku_health||[]).filter(item=>`${item.product_title||''} ${item.sku_code||''}`.toLowerCase().includes(query));$('#sku-sales-heading').textContent=`近${selectedDays}日销量`;$('#sku-health').innerHTML=rows.length?rows.map(item=>{const sales=item.sales?.[selectedDays]||item.sales?.['14']||{};const complete=sales.data_completeness==='complete';return `<tr><td><strong>${escapeHtml(item.product_title||`商品 #${item.product_id}`)}</strong><br><span class="muted">${escapeHtml(item.sku_code)}${item.variant_label?` · ${escapeHtml(item.variant_label)}`:''}</span></td><td>${escapeHtml(item.on_hand_qty)}</td><td>${escapeHtml(sales.sales_qty??'数据不足')}</td><td>${escapeHtml(sales.daily_avg_qty??'数据不足')}</td><td>${escapeHtml(item.days_of_inventory??'数据不足')}</td><td>${escapeHtml(complete?item.suggested_replenishment_qty:'数据不足')}</td><td>${statusTag(item)}<br><span class="muted">${escapeHtml(complete?'覆盖完整':`有效 ${sales.effective_sale_days??0}/${selectedDays} 天`)}</span></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">没有匹配的 SKU，或当前数据不足。</td></tr>';}
function renderDetails(){const alerts=body.alert_summary?.recent||[];$('#alert-details').innerHTML=alerts.length?`<table><thead><tr><th>告警</th><th>商品 / SKU</th><th>级别</th><th>状态</th><th>说明</th></tr></thead><tbody>${alerts.map(item=>`<tr><td>#${escapeHtml(item.id)} ${escapeHtml(item.kind)}</td><td>${escapeHtml(item.product_title||'未关联商品')} / ${escapeHtml(item.sku_code||`SKU #${item.sku_id||'未关联'}`)}</td><td>${escapeHtml(item.severity)}</td><td>${escapeHtml(item.status)}</td><td>${escapeHtml(item.title)}：${escapeHtml(item.message)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无待处理告警</div>';const inbounds=body.recent_inbounds||[];$('#inbounds').innerHTML=inbounds.length?`<table><thead><tr><th>单号</th><th>仓库</th><th>状态</th><th>预计</th><th>实收</th></tr></thead><tbody>${inbounds.map(item=>`<tr><td>${escapeHtml(item.reference_no)}</td><td>${escapeHtml(item.warehouse_id)}</td><td>${escapeHtml(item.status)}</td><td>${escapeHtml(item.expected_qty)}</td><td>${escapeHtml(item.received_qty)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无最近入库</div>';$('#limitations').textContent=(body.limitations||[]).join('；');}
async function loadDimensions(){try{const [warehouses,skus]=await Promise.all([fetch('/api/warehouses',{credentials:'same-origin'}).then(r=>r.json()),fetch('/api/skus',{credentials:'same-origin'}).then(r=>r.json())]);$('#warehouse-filter').innerHTML='<option value="">全部仓库</option>'+(warehouses||[]).map(item=>`<option value="${item.id}">${escapeHtml(item.code)} · ${escapeHtml(item.name)}</option>`).join('');$('#sku-filter').innerHTML='<option value="">全部 SKU</option>'+(skus||[]).map(item=>`<option value="${item.id}">${escapeHtml(item.sku_code)}${item.variant_label?` · ${escapeHtml(item.variant_label)}`:''}</option>`).join('');}catch(error){message.className='error';message.textContent=`筛选项加载失败：${error.message||'网络错误'}`;}}
async function load(){const sequence=++requestSequence;try{message.className='status-line';message.textContent='正在加载看板…';const days=Number($('#days').value||14);const warehouse=$('#warehouse-filter').value;const sku=$('#sku-filter').value;const params=new URLSearchParams({days:String(days),recent_limit:'20'});if(warehouse)params.set('warehouse_id',warehouse);if(sku)params.set('sku_id',sku);const response=await fetch(`/api/dashboard/summary?${params}`,{credentials:'same-origin'});const data=await response.json();if(sequence!==requestSequence)return;if(!response.ok)throw new Error(data.detail?.message||'看板加载失败');body=data;renderKpis();renderSales();renderInventory();renderSku();renderDetails();message.textContent=`统计截至 ${data.sales_summary?.as_of||'未知'} · 当前为离线/mock 数据`;}catch(error){if(sequence===requestSequence){message.className='error';message.textContent=error.message||'网络错误';}}}
$('#days').onchange=load;$('#warehouse-filter').onchange=load;$('#sku-filter').onchange=load;$('#sku-search').oninput=renderSku;$('#refresh').onclick=load;$('#logout').onclick=async()=>{await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':decodeURIComponent(document.cookie.split('; ').find(value=>value.startsWith('dianshang_csrf='))?.split('=').slice(1).join('=')||'')}});location.href='/login';};window.addEventListener('resize',()=>{salesChart?.resize();inventoryChart?.resize();});loadDimensions().then(load);
</script></body></html>

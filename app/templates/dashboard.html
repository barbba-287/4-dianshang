<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>库存运营概览</title>
<style>body{max-width:1100px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;color:#243044;background:#f8fafc}section{margin-top:1rem;padding:1rem;background:#fff;border:1px solid #e2e8f0;border-radius:.6rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}.card{padding:.8rem;border:1px solid #e2e8f0;border-radius:.5rem}.value{font-size:1.5rem;font-weight:700}.muted{color:#64748b}.error{color:#b91c1c}table{width:100%;border-collapse:collapse;margin-top:.7rem}th,td{padding:.55rem;border-bottom:1px solid #e2e8f0;text-align:left}</style></head>
<body><header><h1>库存运营概览</h1><p class="muted">内部库存与入库质量看板 · 离线/mock 数据不代表生产指标</p></header>
<p id="message" role="status">正在加载…</p><section><h2>核心指标</h2><div id="kpis" class="cards"></div></section>
<section><h2>最近入库</h2><div class="table-wrap"><table><thead><tr><th>单号</th><th>仓库</th><th>状态</th><th>预计</th><th>实收总数</th></tr></thead><tbody id="inbounds"></tbody></table></div></section>
<section><h2>指标口径</h2><p class="muted">已确认库存 = 内部 on_hand；合格入库 = 实收总数 - 破损；差异 = 实收总数 - 预计数量。</p><p id="limitations" class="muted"></p></section>
<script>
const message=document.querySelector('#message');
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function load(){try{const response=await fetch('/api/dashboard/summary?days=7&recent_limit=20',{credentials:'same-origin'});const body=await response.json();if(!response.ok)throw new Error(body.detail?.message||'看板加载失败');const labels={product_count:'商品数',active_sku_count:'启用 SKU',active_warehouse_count:'启用仓库',on_hand_qty:'已确认库存',inventory_balance_count:'库存组合',expected_inbound_count:'待处理入库',received_inbound_count:'待确认入库',confirmed_inbound_count:'已确认入库',expected_qty:'预计数量',received_qty:'实收总数',damaged_qty:'破损数量',accepted_qty:'合格入库',difference_qty:'收货差异',failed_job_count:'失败任务'};document.querySelector('#kpis').innerHTML=Object.entries(body.kpis).filter(([key])=>labels[key]).map(([key,value])=>`<div class="card"><div class="muted">${labels[key]}</div><div class="value">${escapeHtml(value)}</div></div>`).join('');document.querySelector('#inbounds').innerHTML=body.recent_inbounds.length?body.recent_inbounds.map(item=>`<tr><td>${escapeHtml(item.reference_no)}</td><td>${escapeHtml(item.warehouse_id)}</td><td>${escapeHtml(item.status)}</td><td>${escapeHtml(item.expected_qty)}</td><td>${escapeHtml(item.received_qty)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">暂无入库数据</td></tr>';document.querySelector('#limitations').textContent=body.unsupported_metrics.join('、')+' 暂不可计算。';message.textContent=`统计范围：最近 ${body.range.days} 天`;message.className='';}catch(error){message.textContent=error.message||'网络错误';message.className='error';}}
load();
</script></body></html>

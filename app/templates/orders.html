<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>订单事实</title><link rel="stylesheet" href="/static/workspace-shell.css"><script src="/static/labels.js?v=20260915-2"></script><style>
.panel{background:#fff;border:1px solid #e4eaf2;border-radius:.7rem;padding:1rem;margin-top:1rem}.filters{display:flex;flex-wrap:wrap;gap:.65rem;align-items:end}.field{display:flex;flex-direction:column;gap:.25rem;color:#69778b;font-size:.8rem}select,input,button{font:inherit;padding:.5rem .65rem;border:1px solid #ccd7e5;border-radius:.45rem}button{background:#2a78d6;color:#fff;border:0;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.7rem}.card{background:#fff;border:1px solid #e4eaf2;border-radius:.6rem;padding:.8rem;margin-top:1rem}.value{font-size:1.35rem;font-weight:700}.muted{color:#69778b;font-size:.82rem}.tag{display:inline-block;padding:.2rem .5rem;border-radius:99px;background:#edf2f7;font-size:.75rem}.warn{background:#fff4d6;color:#946500}.good{background:#e9f7ec;color:#14751a}.error{color:#a72727}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:.65rem;border-bottom:1px solid #e4eaf2;text-align:left;font-size:.82rem;vertical-align:top}.detail{margin-top:1rem;padding:1rem;background:#f7fafe;border:1px solid #dce7f2;border-radius:.5rem}.detail[hidden]{display:none}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div class="muted">Workspace / <strong>订单事实</strong></div><button id="logout">退出登录</button></header><div class="content"><div class="page-heading"><div><h1>订单事实</h1><p class="muted">外部平台订单只读视图；订单状态不等于内部履约完成，不执行发货、面单、付款或退款。</p></div><button id="export-proposal" type="button">导出待发清单（人工履约）</button></div><p id="export-status" class="muted"></p><section class="panel"><div class="filters"><label class="field">履约视图<select id="fulfillment"><option value="">全部订单</option><option value="needs_attention">待人工处理</option><option value="to_fulfill">待发（外部已支付）</option><option value="fulfilled">已履约事实</option><option value="cancelled">已取消/关闭</option></select></label><label class="field">状态<select id="status"><option value="">全部状态</option><option value="pending">待处理</option><option value="paid">已支付</option><option value="fulfilled">已履约事实</option><option value="completed">已完成</option><option value="cancelled">已取消</option><option value="unknown">未知</option></select></label><label class="field">平台<input id="platform" placeholder="shopify / mock"></label><label class="field">关键词<input id="keyword" placeholder="订单号、平台或店铺"></label><label class="field">开始日期<input id="date-from" type="date"></label><label class="field">结束日期<input id="date-to" type="date"></label><button id="search">查询</button></div><p id="status-message" class="muted">正在加载…</p></section><div id="cards" class="cards"></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>订单号</th><th>平台/店铺</th><th>状态</th><th>下单时间</th><th>金额</th><th>商品件数</th><th>完整度</th><th>来源</th><th>操作</th></tr></thead><tbody id="orders"></tbody></table></div><div id="detail" class="detail" hidden></div></section></div></main></div><script>
const $=s=>document.querySelector(s);let body=null;function token(){const x=document.cookie.split('; ').find(v=>v.startsWith('dianshang_csrf='));return x?decodeURIComponent(x.split('=').slice(1).join('=')):'';}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}const statusLabels={pending:'待处理',paid:'已支付',fulfilled:'已履约事实',completed:'已完成',cancelled:'已取消',closed:'已关闭',unknown:'未知'};const platformLabels={shopify:'Shopify',mock:'模拟平台',taobao:'淘宝',jd:'京东',pdd:'拼多多',douyin:'抖音',amazon:'亚马逊'};function label(map,v){return map[v]||v||'未知';}async function api(path){const r=await fetch(path,{credentials:'same-origin'});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail?.message||'请求失败');return b;}function params(){const p=new URLSearchParams({page:'1',page_size:'100'});for(const [id,key] of [['fulfillment','fulfillment_view'],['status','order_status'],['platform','platform'],['keyword','keyword'],['date-from','date_from'],['date-to','date_to']]){const v=$(`#${id}`).value.trim();if(v)p.set(key,v);}return p;}function render(){const items=body?.items||[];const s=body?.summary||{};$('#cards').innerHTML=[['当前订单',s.returned_count||0],['待人工处理',s.by_status?.pending||0],['待发（已支付）',s.by_status?.paid||0],['已履约事实',(s.by_status?.fulfilled||0)+(s.by_status?.completed||0)],['数据不完整',s.data_incomplete_count||0]].map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="value">${esc(v)}</div></div>`).join('');$('#orders').innerHTML=items.length?items.map(item=>`<tr><td><strong>${esc(item.external_order_no)}</strong><br><span class="muted">#${esc(item.id)}</span></td><td>${esc(label(platformLabels,item.platform))}<br><span class="muted">${esc(item.store_ref)}</span></td><td><span class="tag ${item.order_status==='paid'?'warn':item.order_status==='fulfilled'||item.order_status==='completed'?'good':''}">${esc(label(statusLabels,item.order_status))}</span></td><td>${esc(item.external_created_at)}</td><td>${esc(item.gross_amount)} ${esc(item.currency)}</td><td>${esc(item.net_item_qty)}（${esc(item.line_count)} 行）</td><td>${esc(item.data_completeness)}</td><td>${item.simulated?'<span class="tag warn">模拟/回放</span>':'<span class="tag good">真实来源</span>'}<br><span class="muted">${esc(item.source_mode)}</span></td><td><button type="button" data-order-id="${esc(item.id)}">查看详情</button></td></tr>`).join(''):'<tr><td colspan="9" class="muted">暂无订单事实；没有数据不代表接口失败。</td></tr>';document.querySelectorAll('[data-order-id]').forEach(b=>b.onclick=()=>loadDetail(b.dataset.orderId));}async function exportProposal(){const button=$('#export-proposal');const out=$('#export-status');button.disabled=true;out.className='muted';out.textContent='正在生成待发清单…';try{const query=params();query.delete('page');query.delete('page_size');query.set('page_size','200');const r=await fetch(`/api/orders/fulfillment-proposal.xlsx?${query}`,{credentials:'same-origin'});const type=(r.headers.get('content-type')||'').toLowerCase();if(!r.ok||!type.includes('spreadsheetml.sheet')){const text=await r.text();let detail=text;try{const body=JSON.parse(text);detail=body.detail?.message||body.detail||text;}catch(_){ }throw Error(typeof detail==='string'?detail:`导出失败（HTTP ${r.status}）`);}const blob=await r.blob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;const disposition=r.headers.get('content-disposition')||'';const encodedFilename=disposition.match(/filename\*=UTF-8''([^;]+)/i)?.[1];const plainFilename=disposition.match(/filename="?([^";]+)"?/i)?.[1];link.download=encodedFilename?decodeURIComponent(encodedFilename):(plainFilename||'待发清单-人工履约.xlsx');document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);out.className='muted';out.textContent=`待发清单已下载：${r.headers.get('x-export-order-count')||0} 个订单；仅为人工履约 Proposal，履约前请回平台复核。`;}catch(e){out.className='error';out.textContent=`导出失败：${e.message||'网络错误'}`;}finally{button.disabled=false;}}
async function loadDetail(id){try{const item=await api(`/api/orders/${encodeURIComponent(id)}`);$('#detail').hidden=false;$('#detail').innerHTML=`<h3>订单详情：${esc(item.external_order_no)}</h3><p class="muted">外部订单事实，只读。${item.order_status==='paid'?'当前为外部已支付，待人工履约，不代表已发货。':''}</p><div class="table-wrap"><table><thead><tr><th>外部 SKU</th><th>内部 SKU</th><th>订购数量</th><th>取消</th><th>退款</th><th>映射状态</th><th>金额</th></tr></thead><tbody>${(item.lines||[]).map(line=>`<tr><td>${esc(line.external_sku)}</td><td>${esc(line.internal_sku_id||'未映射')}</td><td>${esc(line.ordered_qty)}</td><td>${esc(line.cancelled_qty)}</td><td>${esc(line.refunded_qty)}</td><td>${esc(line.mapping_status)}</td><td>${esc(line.gross_amount)} ${esc(line.currency)}</td></tr>`).join('')||'<tr><td colspan="7">暂无行项目</td></tr>'}</tbody></table></div>`;}catch(e){$('#detail').hidden=false;$('#detail').innerHTML=`<p class="error">详情加载失败：${esc(e.message)}</p>`;}}
async function load(){try{$('#status-message').className='muted';$('#status-message').textContent='正在加载订单事实…';body=await api(`/api/orders?${params()}`);render();$('#status-message').textContent=`返回 ${body.items.length} / ${body.total} 条；${body.meta?.limitations?.join('；')||''}`;}catch(e){$('#status-message').className='error';$('#status-message').textContent=`加载失败：${e.message||'网络错误'}`;$('#orders').innerHTML='<tr><td colspan="9" class="error">订单数据加载失败，请刷新重试。</td></tr>';}}
$('#search').onclick=load;$('#export-proposal').onclick=exportProposal;$('#logout').onclick=async()=>{await fetch('/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':token()}});location.href='/login';};load();
</script></body></html>

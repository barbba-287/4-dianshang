<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>仓库收货</title>
<link rel="stylesheet" href="/static/workspace-shell.css">
<script src="/static/labels.js"></script>
<style>
body{background:var(--shell-page);color:var(--shell-ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.sidebar{min-height:100vh}.content{max-width:1120px}.panel{margin-top:1rem}
</style></head>
<body><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div class="muted">Workspace / <strong>仓库收货</strong></div><div><button id="logout" type="button">退出登录</button></div></header><div class="content"><div class="page-heading"><div><h1>仓库收货</h1><p class="muted">提交授权仓库的实收反馈；运营确认前不会改变内部库存。</p></div></div><section class="panel"><div class="panel-head"><h2>选择授权仓库</h2><span class="muted">仅显示当前账户可访问范围</span></div><p id="message" class="status">正在加载授权仓库…</p><div class="row"><div class="field"><label for="warehouse">授权仓库</label><select id="warehouse"></select></div><button id="refresh" type="button">刷新待收货单</button></div></section><section class="panel"><div class="panel-head"><h2>待收货入库单</h2><span class="muted">选择单据后核对预计数量</span></div><div class="row"><div class="field"><label for="inbound">入库单</label><select id="inbound"></select></div><button id="load-inbound" type="button" disabled>加载明细</button></div><div id="details" class="table-wrap"></div></section><section class="panel"><div class="panel-head"><h2>仓库实收反馈</h2><span class="muted">含实收总数与破损数量</span></div><p id="state" class="muted">请选择入库单。</p><div id="receive-lines"></div><div class="row"><button id="receive" type="button" disabled>提交实收</button></div></section></div></main></div><script>
const $=selector=>document.querySelector(selector); const message=$('#message'); const warehouse=$('#warehouse'); const inbound=$('#inbound'); const loadInbound=$('#load-inbound'); const receive=$('#receive'); let current=null; let receiveKey=null;
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function csrfToken(){const item=document.cookie.split('; ').find(value=>value.startsWith('dianshang_csrf='));return item?decodeURIComponent(item.slice('dianshang_csrf='.length)):'';}
async function api(path, options={}){const headers={'X-CSRF-Token':csrfToken(),...(options.headers||{})};const response=await fetch(path,{credentials:'same-origin',...options,headers});let body;try{body=await response.json();}catch{body={};}if(!response.ok)throw new Error(body.detail?.message||'请求失败');return body;}
function busy(button,value){button.disabled=value;button.textContent=value?'提交中…':button.dataset.text||button.textContent;if(!value)button.textContent=button.dataset.text||'提交实收';}
async function loadWarehouses(){try{const data=await api('/api/warehouses');warehouse.innerHTML=data.length?data.map(item=>`<option value="${item.id}">${escapeHtml(item.code)} · ${escapeHtml(item.name)}</option>`).join(''):'<option value="">暂无授权仓库</option>';await loadInbounds();}catch(error){message.className='error';message.textContent=`加载失败：${error.message}`;}}
async function loadInbounds(){try{if(!warehouse.value){inbound.innerHTML='<option value="">暂无待收货单</option>';loadInbound.disabled=true;return;}const data=await api(`/api/inbounds?warehouse_id=${encodeURIComponent(warehouse.value)}&status=expected`);inbound.innerHTML=data.items?.length?data.items.map(item=>`<option value="${item.id}">${escapeHtml(item.reference_no)}</option>`).join(''):'<option value="">暂无待收货单</option>';loadInbound.disabled=!inbound.value;await selectInbound();}catch(error){message.className='error';message.textContent=`入库单加载失败：${error.message}`;}}
async function selectInbound(){if(!inbound.value){current=null;loadInbound.disabled=true;receive.disabled=true;$('#state').textContent='请选择入库单。';$('#details').innerHTML='';$('#receive-lines').innerHTML='';return;}try{current=await api(`/api/inbounds/${inbound.value}`);receiveKey=sessionStorage.getItem(`receive-key-${current.id}`)||`receive-${current.id}-${crypto.randomUUID?.()||Date.now()}`;sessionStorage.setItem(`receive-key-${current.id}`,receiveKey);$('#state').textContent=`${current.reference_no}：${dianshangLabel(current.status, DianShangLabels.status, '未知状态')}`;$('#details').innerHTML=`<table><thead><tr><th>SKU</th><th>预计数量</th><th>状态</th></tr></thead><tbody>${current.lines.map(line=>`<tr><td>${escapeHtml(line.sku_id)}</td><td>${escapeHtml(line.expected_qty)}</td><td>${escapeHtml(dianshangLabel(current.status, DianShangLabels.status, '未知状态'))}</td></tr>`).join('')}</tbody></table>`;$('#receive-lines').innerHTML=current.lines.map(line=>`<div class="row" data-receive-line="${line.sku_id}"><strong>SKU #${escapeHtml(line.sku_id)}</strong><label>实收<input data-received type="number" min="0" value="${escapeHtml(line.received_qty||0)}"></label><label>破损<input data-damaged type="number" min="0" value="${escapeHtml(line.damaged_qty||0)}"></label></div>`).join('');receive.disabled=current.status!=='expected';}catch(error){message.className='error';message.textContent=`详情加载失败：${error.message}`;}}
async function logout(){try{await api('/logout',{method:'POST',body:'{}'});location.href='/login';}catch(error){message.className='error';message.textContent=`退出失败：${error.message}`;}}
warehouse.onchange=loadInbounds;inbound.onchange=selectInbound;loadInbound.onclick=selectInbound;$('#refresh').onclick=loadWarehouses;$('#logout').onclick=logout;receive.onclick=async()=>{if(!current)return;busy(receive,true);try{const lines=[...document.querySelectorAll('[data-receive-line]')].map(row=>({sku_id:Number(row.dataset.receiveLine),received_qty:Number(row.querySelector('[data-received]').value),damaged_qty:Number(row.querySelector('[data-damaged]').value)}));current=await api(`/api/inbounds/${current.id}/receive`,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':receiveKey},body:JSON.stringify({lines})});const line=current.lines[0];$('#state').className='ok';$('#state').textContent=`已提交：实收反馈已保存，等待运营确认`;receive.disabled=true;$('#details').innerHTML=`<p>实收反馈已保存；合格入库数量将在运营确认后生效。</p>`;}catch(error){message.className='error';message.textContent=`提交失败：${error.message}`;}finally{busy(receive,false);if(current)receive.disabled=current.status!=='expected';}};
loadWarehouses();
</script></body></html>

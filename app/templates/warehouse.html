<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>仓库收货工作台</title>
<style>body{max-width:900px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;color:#243044;background:#f8fafc}section{margin-top:1rem;padding:1rem;background:#fff;border:1px solid #e2e8f0;border-radius:.6rem}.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end}.field{display:flex;flex-direction:column;gap:.25rem;flex:1 1 160px}input,select,button{min-height:2.4rem;padding:.5rem;border:1px solid #cbd5e1;border-radius:.4rem;font:inherit}button{background:#2563eb;color:#fff;border:0}button:disabled{background:#94a3b8;cursor:not-allowed}.muted{color:#64748b}.error{color:#b91c1c}.ok{color:#15803d}table{width:100%;border-collapse:collapse;margin-top:.8rem}th,td{padding:.55rem;border-bottom:1px solid #e2e8f0;text-align:left}</style></head>
<body><header><h1>仓库收货工作台</h1><p class="muted">仅处理授权仓库的实收反馈，不负责运营确认入账。</p><p><button id="logout" type="button">退出登录</button></p></header>
<section><h2>选择仓库</h2><p id="message" role="status">正在加载授权仓库…</p><div class="row"><div class="field"><label for="warehouse">授权仓库</label><select id="warehouse"></select></div><button id="refresh" type="button">刷新待收货单</button></div></section>
<section><h2>待收货入库单</h2><div class="row"><div class="field"><label for="inbound">入库单</label><select id="inbound"></select></div><button id="load-inbound" type="button" disabled>加载明细</button></div><div id="details"></div></section>
<section><h2>仓库实收反馈</h2><p id="state" class="muted">请选择入库单。</p><div class="row"><div class="field"><label for="received">实收总数（含破损）</label><input id="received" type="number" min="0" value="0"></div><div class="field"><label for="damaged">其中破损数量</label><input id="damaged" type="number" min="0" value="0"></div><button id="receive" type="button" disabled>提交实收</button></div></section>
<script>
const $=selector=>document.querySelector(selector); const message=$('#message'); const warehouse=$('#warehouse'); const inbound=$('#inbound'); const loadInbound=$('#load-inbound'); const receive=$('#receive'); let current=null; let receiveKey=null;
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function csrfToken(){const item=document.cookie.split('; ').find(value=>value.startsWith('dianshang_csrf='));return item?decodeURIComponent(item.slice('dianshang_csrf='.length)):'';}
async function api(path, options={}){const headers={'X-CSRF-Token':csrfToken(),...(options.headers||{})};const response=await fetch(path,{credentials:'same-origin',...options,headers});let body;try{body=await response.json();}catch{body={};}if(!response.ok)throw new Error(body.detail?.message||'请求失败');return body;}
function busy(button,value){button.disabled=value;button.textContent=value?'提交中…':button.dataset.text||button.textContent;if(!value)button.textContent=button.dataset.text||'提交实收';}
async function loadWarehouses(){try{const data=await api('/api/warehouses');warehouse.innerHTML=data.length?data.map(item=>`<option value="${item.id}">${escapeHtml(item.code)} · ${escapeHtml(item.name)}</option>`).join(''):'<option value="">暂无授权仓库</option>';await loadInbounds();}catch(error){message.className='error';message.textContent=`加载失败：${error.message}`;}}
async function loadInbounds(){try{if(!warehouse.value){inbound.innerHTML='<option value="">暂无待收货单</option>';loadInbound.disabled=true;return;}const data=await api(`/api/inbounds?warehouse_id=${encodeURIComponent(warehouse.value)}&status=expected`);inbound.innerHTML=data.items?.length?data.items.map(item=>`<option value="${item.id}">${escapeHtml(item.reference_no)}</option>`).join(''):'<option value="">暂无待收货单</option>';loadInbound.disabled=!inbound.value;await selectInbound();}catch(error){message.className='error';message.textContent=`入库单加载失败：${error.message}`;}}
async function selectInbound(){if(!inbound.value){current=null;loadInbound.disabled=true;receive.disabled=true;$('#state').textContent='请选择入库单。';$('#details').innerHTML='';return;}try{current=await api(`/api/inbounds/${inbound.value}`);receiveKey=sessionStorage.getItem(`receive-key-${current.id}`)||`receive-${current.id}-${crypto.randomUUID?.()||Date.now()}`;sessionStorage.setItem(`receive-key-${current.id}`,receiveKey);$('#state').textContent=`${current.reference_no}：${current.status}`;$('#details').innerHTML=`<table><thead><tr><th>SKU</th><th>预计数量</th><th>状态</th></tr></thead><tbody>${current.lines.map(line=>`<tr><td>${escapeHtml(line.sku_id)}</td><td>${escapeHtml(line.expected_qty)}</td><td>${escapeHtml(current.status)}</td></tr>`).join('')}</tbody></table>`;receive.disabled=current.status!=='expected';}catch(error){message.className='error';message.textContent=`详情加载失败：${error.message}`;}}
async function logout(){try{await api('/logout',{method:'POST',body:'{}'});location.href='/login';}catch(error){message.className='error';message.textContent=`退出失败：${error.message}`;}}
warehouse.onchange=loadInbounds;inbound.onchange=selectInbound;loadInbound.onclick=selectInbound;$('#refresh').onclick=loadWarehouses;$('#logout').onclick=logout;receive.onclick=async()=>{if(!current)return;busy(receive,true);try{const lines=current.lines.map(line=>({sku_id:line.sku_id,received_qty:Number($('#received').value),damaged_qty:Number($('#damaged').value)}));current=await api(`/api/inbounds/${current.id}/receive`,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':receiveKey},body:JSON.stringify({lines})});const line=current.lines[0];$('#state').className='ok';$('#state').textContent=`已提交：实收总数 ${line.received_qty}，破损 ${line.damaged_qty}，等待运营确认`;receive.disabled=true;$('#details').innerHTML=`<p>数量差异：${line.difference}；合格入库数量将在运营确认后生效。</p>`;}catch(error){message.className='error';message.textContent=`提交失败：${error.message}`;}finally{busy(receive,false);if(current)receive.disabled=current.status!=='expected';}};
loadWarehouses();
</script></body></html>

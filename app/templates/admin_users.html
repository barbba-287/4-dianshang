<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>账户与仓库授权</title>
<style>
body{max-width:1180px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;color:#243044;background:#f8fafc}
section{background:#fff;border:1px solid #e2e8f0;border-radius:.6rem;padding:1rem;margin-top:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end}.field{display:flex;flex-direction:column;gap:.25rem;flex:1 1 150px}
label{font-size:.9rem;color:#475569}input,select,button{min-height:2.4rem;padding:.5rem;border:1px solid #cbd5e1;border-radius:.4rem;font:inherit}
button{background:#2563eb;color:#fff;border:0;cursor:pointer}button.secondary{background:#475569}button.danger{background:#b91c1c}button:disabled{background:#94a3b8;cursor:not-allowed}
.muted{color:#64748b}.error{color:#b91c1c}.ok{color:#15803d}table{width:100%;border-collapse:collapse;margin-top:.8rem}th,td{padding:.55rem;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}.tag{padding:.15rem .4rem;border-radius:.25rem;background:#e2e8f0}.actions{display:flex;flex-wrap:wrap;gap:.35rem}.actions select{min-height:2rem;padding:.25rem}
</style>
</head>
<body>
<header><h1>账户与仓库授权</h1><p class="muted">管理员只能管理当前工作空间成员；仓库授权决定员工可以处理的数据范围。</p></header>
<p id="message" role="status">正在加载…</p>
<section><h2>创建账户</h2>
<form id="create-user" class="row">
<div class="field"><label for="login">登录名</label><input id="login" required maxlength="128" autocomplete="username"></div>
<div class="field"><label for="display-name">显示名称</label><input id="display-name" required maxlength="255"></div>
<div class="field"><label for="password">初始密码</label><input id="password" required minlength="8" maxlength="128" type="password"></div>
<div class="field"><label for="role">角色</label><select id="role"><option value="operations">运营</option><option value="warehouse">仓库协作方</option><option value="customer_service">客服</option><option value="readonly">只读成员</option></select></div>
<div class="field"><label for="warehouse-ids">初始授权仓库（可多选）</label><select id="warehouse-ids" multiple size="3"></select></div>
<button type="submit">创建账户</button>
</form><p class="muted">仓库协作方必须至少选择一个有效仓库；其他角色可稍后授权。</p>
</section>
<section><h2>成员列表</h2><div class="row"><button id="refresh" type="button">刷新</button><button id="logout" class="secondary" type="button">退出登录</button><a href="/ops">返回运营工作台</a></div>
<div style="overflow:auto"><table><thead><tr><th>登录名</th><th>名称</th><th>角色</th><th>状态</th><th>授权仓库</th><th>账户操作</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section><h2>当前工作空间仓库</h2><p class="muted">标记为“未绑定”的旧仓库只允许管理员执行 NULL → 当前工作空间绑定，不会覆盖其他工作空间归属。</p><div style="overflow:auto"><table><thead><tr><th>编码</th><th>名称</th><th>类型</th><th>工作空间</th><th>操作</th></tr></thead><tbody id="warehouses"></tbody></table></div></section>
<script>
const message=document.querySelector('#message'), users=document.querySelector('#users'), warehousesBody=document.querySelector('#warehouses'), warehouseIds=document.querySelector('#warehouse-ids');
const roleLabels={operations:'运营',warehouse:'仓库协作方',customer_service:'客服',readonly:'只读成员',admin:'管理员'};
let warehouseList=[];
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function csrf(){const item=document.cookie.split('; ').find(value=>value.startsWith('dianshang_csrf='));return item?decodeURIComponent(item.slice('dianshang_csrf='.length)):'';}
async function api(path,options={}){const headers={'Content-Type':'application/json','X-CSRF-Token':csrf(),...(options.headers||{})};const response=await fetch(path,{credentials:'same-origin',...options,headers});let body=null;try{body=await response.json();}catch{}if(!response.ok)throw new Error(body?.detail?.message||body?.detail||'请求失败');return body;}
function setMessage(text,kind=''){message.className=kind;message.textContent=text;}
function warehouseLabel(id){const item=warehouseList.find(value=>value.id===id);return item?`${item.code} · ${item.name}`:`#${id}`;}
function renderWarehouseOptions(){warehouseIds.innerHTML=warehouseList.filter(item=>item.workspace_id!==null).map(item=>`<option value="${item.id}">${escapeHtml(item.code)} · ${escapeHtml(item.name)}</option>`).join('')||'<option value="">暂无已绑定仓库</option>';}
async function loadWarehouses(){const data=await api('/api/admin/warehouses');warehouseList=data;renderWarehouseOptions();warehousesBody.innerHTML=data.length?data.map(item=>`<tr><td>${escapeHtml(item.code)}</td><td>${escapeHtml(item.name)}</td><td>${escapeHtml(item.warehouse_type)}</td><td>${item.workspace_id===null?'<span class="tag">未绑定</span>':escapeHtml(item.workspace_id)}</td><td>${item.workspace_id===null?`<button data-action="bind" data-id="${item.id}">绑定到当前空间</button>`:'已绑定'}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">暂无仓库</td></tr>';}
function renderUsers(data){users.innerHTML=data.length?data.map(item=>{const access=item.warehouse_ids.map(id=>`<span class="tag">${escapeHtml(warehouseLabel(id))}</span>`).join(' ')||'<span class="muted">无</span>';const grantOptions=warehouseList.filter(w=>w.workspace_id!==null).map(w=>`<option value="${w.id}">授权 ${escapeHtml(w.code)}</option>`).join('');return `<tr><td>${escapeHtml(item.login)}</td><td>${escapeHtml(item.display_name)}</td><td><span class="tag">${escapeHtml(roleLabels[item.role]||item.role)}</span></td><td>${escapeHtml(item.status)}</td><td>${access}<div class="actions"><select data-action="grant" data-id="${item.id}"><option value="">选择仓库后授权</option>${grantOptions}</select>${item.warehouse_ids.map(id=>`<button class="danger" data-action="revoke" data-id="${item.id}" data-warehouse-id="${id}">撤销 ${escapeHtml(warehouseLabel(id))}</button>`).join('')}</div></td><td><div class="actions"><button data-action="edit" data-id="${item.id}">编辑</button><button data-action="reset" data-id="${item.id}">重置密码</button>${item.status==='active'?`<button class="danger" data-action="deactivate" data-id="${item.id}">停用</button>`:`<button data-action="activate" data-id="${item.id}">启用</button>`}</div></td></tr>`;}).join(''):'<tr><td colspan="6" class="muted">暂无成员</td></tr>';}
async function load(){try{const [data]=await Promise.all([api('/api/admin/users'),loadWarehouses()]);renderUsers(data);setMessage(`已加载 ${data.length} 个成员`,'ok');}catch(error){setMessage(`加载失败：${error.message}`,'error');}}
document.querySelector('#create-user').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({login:document.querySelector('#login').value.trim(),display_name:document.querySelector('#display-name').value.trim(),password:document.querySelector('#password').value,role:document.querySelector('#role').value,warehouse_ids:[...warehouseIds.selectedOptions].map(item=>Number(item.value))})});event.target.reset();setMessage('账户创建成功','ok');await load();}catch(error){setMessage(`创建失败：${error.message}`,'error');}finally{button.disabled=false;}};
users.onclick=async event=>{const button=event.target.closest('button[data-action]');if(!button)return;const id=button.dataset.id;const action=button.dataset.action;try{if(action==='edit'){const name=prompt('新的显示名称');if(name===null)return;const role=prompt('角色：operations / warehouse / customer_service / readonly', '');if(role===null)return;await api(`/api/admin/users/${id}`,{method:'PATCH',body:JSON.stringify({display_name:name,role:role||undefined})});}else if(action==='reset'){const password=prompt('输入新密码（至少 8 位）');if(password===null)return;await api(`/api/admin/users/${id}/reset-password`,{method:'POST',body:JSON.stringify({password})});}else if(action==='grant'){return;}else if(action==='revoke'){await api(`/api/admin/users/${id}/warehouses/${button.dataset.warehouseId}`,{method:'DELETE'});}else{await api(`/api/admin/users/${id}/${action}`,{method:'POST',body:'{}'});}setMessage('操作成功','ok');await load();}catch(error){setMessage(`操作失败：${error.message}`,'error');}};
users.onchange=async event=>{const select=event.target.closest('select[data-action="grant"]');if(!select||!select.value)return;try{await api(`/api/admin/users/${select.dataset.id}/warehouses/${select.value}`,{method:'POST',body:'{}'});setMessage('仓库授权成功','ok');await load();}catch(error){setMessage(`授权失败：${error.message}`,'error');}finally{select.value='';}};
warehousesBody.onclick=async event=>{const button=event.target.closest('button[data-action="bind"]');if(!button)return;if(!confirm('仅将未绑定仓库绑定到当前工作空间，继续吗？'))return;try{await api(`/api/admin/warehouses/${button.dataset.id}/bind`,{method:'POST',body:'{}'});setMessage('旧仓库绑定成功','ok');await load();}catch(error){setMessage(`绑定失败：${error.message}`,'error');}};
document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=async()=>{try{await api('/logout',{method:'POST',body:'{}'});location.href='/login';}catch(error){setMessage(`退出失败：${error.message}`,'error');}};load();
</script>
</body></html>

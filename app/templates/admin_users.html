<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>成员权限</title>
<link rel="stylesheet" href="/static/workspace-shell.css">
<script src="/static/labels.js"></script>
<style>
body{margin:0;background:var(--shell-page);color:var(--shell-ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.sidebar{min-height:100vh}.content{max-width:1360px}.admin-grid{display:grid;grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr);gap:1rem}.member-table-wrap{border:1px solid var(--shell-line);border-radius:.55rem}.member-table{min-width:860px}.member-table th,.member-table td{padding:.8rem .75rem}.member-table tbody tr:hover{background:#f8fbff}.member-cell{display:flex;align-items:center;gap:.65rem;min-width:170px}.member-avatar{display:grid;place-items:center;width:2.25rem;height:2.25rem;flex:0 0 2.25rem;border-radius:50%;color:var(--shell-brand);background:#eaf2fc;font-weight:750}.member-name{font-weight:700}.member-login{margin-top:.18rem;color:var(--shell-muted);font-size:.76rem}.member-access{display:flex;flex-wrap:wrap;gap:.3rem;min-width:180px}.member-actions{display:flex;flex-wrap:wrap;gap:.4rem;min-width:180px}.member-actions button,.member-actions select{min-height:2.15rem;padding:.4rem .55rem;font-size:.78rem}.member-actions select{max-width:170px}.member-status{white-space:nowrap}.warehouse-field{margin:0;padding:0;border:0;min-width:0}.warehouse-field legend{padding:0;color:var(--shell-muted);font-size:.8rem}.tag.active{color:#14751a;background:#e9f7ec}.tag.inactive{color:#687589;background:#edf0f4}.picker{display:grid;gap:.45rem;margin-top:.45rem;padding:.7rem;border:1px solid var(--shell-line);border-radius:.55rem;background:#fbfcfe}.picker-option{display:flex;align-items:center;gap:.55rem;padding:.55rem .6rem;border:1px solid transparent;border-radius:.45rem;cursor:pointer}.picker-option:hover,.picker-option:has(input:checked){border-color:#a9c9ec;background:#eaf2fc}.picker-option input{min-height:auto;accent-color:var(--shell-brand)}.picker-count{font-size:.78rem;color:var(--shell-muted)}.visually-hidden,.visually-hidden-select{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.admin-warehouse-panel{grid-column:1/-1}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div class="muted">Workspace / <strong>成员权限</strong></div><button id="logout" type="button">退出登录</button></header><div class="content"><div class="page-heading"><div><h1>成员权限</h1><p class="muted">管理当前 Workspace 成员、角色和仓库数据范围。</p></div></div><p id="message" class="status" role="status">正在加载…</p><div class="admin-grid"><section class="panel"><div class="panel-head"><div><h2>创建账户</h2><p class="panel-subtitle">仓库协作员可直接点击多个仓库，不需要按 Ctrl。</p></div></div>
<form id="create-user" class="row">
<div class="field"><label for="login">登录名</label><input id="login" required maxlength="128" autocomplete="username"></div>
<div class="field"><label for="display-name">显示名称</label><input id="display-name" required maxlength="255"></div>
<div class="field"><label for="password">初始密码</label><input id="password" required minlength="8" maxlength="128" type="password"></div>
<div class="field"><label for="role">角色</label><select id="role"><option value="admin">管理员（当前商家）</option><option value="operations">运营</option><option value="warehouse">仓库协作方</option><option value="customer_service">客服</option><option value="readonly">只读成员</option></select></div>
<div class="field"><fieldset class="warehouse-field"><legend>初始授权仓库（可多选）</legend><select id="warehouse-ids" class="visually-hidden-select" multiple size="3" tabindex="-1"></select><div id="warehouse-picker" class="picker" role="group" aria-label="初始授权仓库"><span class="picker-count" id="warehouse-picker-count">已选 0 个</span><div id="warehouse-picker-options"></div></div></fieldset></div>
<button type="submit">创建账户</button>
</form><p class="muted">仓库协作方必须至少选择一个有效仓库；其他角色可稍后授权。</p>
</section>
<section class="panel"><div class="panel-head"><div><h2>成员列表</h2><p class="panel-subtitle">调整角色、密码和仓库访问范围。</p></div><div class="row"><button id="refresh" type="button">刷新</button></div></div>
<div class="table-wrap member-table-wrap"><table class="member-table"><caption class="visually-hidden">当前工作空间成员列表</caption><thead><tr><th scope="col">成员</th><th scope="col">角色</th><th scope="col">状态</th><th scope="col">授权仓库</th><th scope="col">账户操作</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="panel admin-warehouse-panel"><div class="panel-head"><div><h2>当前工作空间仓库</h2><p class="panel-subtitle">管理当前商家的仓库，以及需要人工确认的旧仓库绑定。</p></div></div><div class="table-wrap"><table><thead><tr><th>编码</th><th>名称</th><th>类型</th><th>工作空间</th><th>操作</th></tr></thead><tbody id="warehouses"></tbody></table></div></section>
<script>
const message=document.querySelector('#message'), users=document.querySelector('#users'), warehousesBody=document.querySelector('#warehouses'), warehouseIds=document.querySelector('#warehouse-ids');
const roleLabels=DianShangLabels.role;
let warehouseList=[];
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function csrf(){const item=document.cookie.split('; ').find(value=>value.startsWith('dianshang_csrf='));return item?decodeURIComponent(item.slice('dianshang_csrf='.length)):'';}
async function api(path,options={}){const headers={'Content-Type':'application/json','X-CSRF-Token':csrf(),...(options.headers||{})};const response=await fetch(path,{credentials:'same-origin',...options,headers});let body=null;try{body=await response.json();}catch{}if(!response.ok)throw new Error(body?.detail?.message||body?.detail||'请求失败');return body;}
function setMessage(text,kind=''){message.className=`status${kind?' '+kind:''}`;message.textContent=text;}
function warehouseLabel(id){const item=warehouseList.find(value=>value.id===id);return item?`${item.code} · ${item.name}`:`#${id}`;}
function renderWarehouseOptions(){const bound=warehouseList.filter(item=>item.workspace_id!==null);warehouseIds.innerHTML=bound.map(item=>`<option value="${item.id}">${escapeHtml(item.code)} · ${escapeHtml(item.name)}</option>`).join('')||'<option value="">暂无已绑定仓库</option>';const options=document.querySelector('#warehouse-picker-options');options.innerHTML=bound.length?bound.map(item=>`<label class="picker-option"><input type="checkbox" data-warehouse-choice value="${item.id}" aria-label="授权 ${escapeHtml(item.code)}"><span><strong>${escapeHtml(item.code)}</strong><br><small class="muted">${escapeHtml(item.name)}</small></span></label>`).join(''):'<span class="muted">暂无已绑定仓库</span>';syncPickerFromSelect();applyRoleState();}
function syncPickerFromSelect(){const selected=new Set([...warehouseIds.selectedOptions].map(item=>Number(item.value)));document.querySelectorAll('[data-warehouse-choice]').forEach(item=>{item.checked=selected.has(Number(item.value));});const count=document.querySelector('#warehouse-picker-count');if(count)count.textContent=`已选 ${selected.size} 个`;}
function syncSelectFromPicker(){const selected=new Set([...document.querySelectorAll('[data-warehouse-choice]:checked')].map(item=>Number(item.value)));[...warehouseIds.options].forEach(item=>{item.selected=selected.has(Number(item.value));});syncPickerFromSelect();}
function applyRoleState(){const disabled=document.querySelector('#role').value==='admin';document.querySelector('#warehouse-picker').style.opacity=disabled?'.55':'1';document.querySelectorAll('[data-warehouse-choice]').forEach(item=>{item.disabled=disabled;item.setAttribute('aria-disabled',String(disabled));if(disabled)item.checked=false;});if(disabled)[...warehouseIds.options].forEach(item=>item.selected=false);syncPickerFromSelect();}
async function loadWarehouses(){const data=await api('/api/admin/warehouses');warehouseList=data;renderWarehouseOptions();warehousesBody.innerHTML=data.length?data.map(item=>`<tr><td>${escapeHtml(item.code)}</td><td>${escapeHtml(item.name)}</td><td>${escapeHtml(dianshangLabel(item.warehouse_type, DianShangLabels.warehouseType, '未知仓库类型'))}</td><td>${item.workspace_id===null?'<span class="tag">未绑定</span>':escapeHtml(item.workspace_id)}</td><td>${item.workspace_id===null?`<button data-action="bind" data-id="${item.id}">绑定到当前空间</button>`:'已绑定'}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">暂无仓库</td></tr>';}
function renderUsers(data){users.innerHTML=data.length?data.map(item=>{const access=item.warehouse_ids.map(id=>`<span class="tag">${escapeHtml(warehouseLabel(id))}</span>`).join(' ')||'<span class="muted">无</span>';const initial=escapeHtml((item.display_name||item.login||'?').trim().slice(0,1).toUpperCase());const statusLabel=item.status==='active'?'启用':'停用';const grantOptions=warehouseList.filter(w=>w.workspace_id!==null).map(w=>`<option value="${w.id}">授权 ${escapeHtml(w.code)}</option>`).join('');return `<tr><td><div class="member-cell"><span class="member-avatar" aria-hidden="true">${initial}</span><div><div class="member-name">${escapeHtml(item.display_name)}</div><div class="member-login">${escapeHtml(item.login)}</div></div></div></td><td><span class="tag">${escapeHtml(roleLabels[item.role]||item.role)}</span></td><td><span class="tag member-status ${item.status==='active'?'active':'inactive'}">${statusLabel}</span></td><td><div class="member-access">${access}</div><div class="member-actions"><select aria-label="为 ${escapeHtml(item.display_name)} 授权仓库" data-action="grant" data-id="${item.id}"><option value="">选择仓库后授权</option>${grantOptions}</select>${item.warehouse_ids.map(id=>`<button class="danger" data-action="revoke" data-id="${item.id}" data-warehouse-id="${id}">撤销 ${escapeHtml(warehouseLabel(id))}</button>`).join('')}</div></td><td><div class="member-actions"><button data-action="edit" data-id="${item.id}">编辑</button><button data-action="reset" data-id="${item.id}">重置密码</button>${item.status==='active'?`<button class="danger" data-action="deactivate" data-id="${item.id}">停用</button>`:`<button data-action="activate" data-id="${item.id}">启用</button>`}</div></td></tr>`;}).join(''):'<tr><td colspan="5" class="muted">暂无成员</td></tr>';}
async function load(){try{const [data]=await Promise.all([api('/api/admin/users'),loadWarehouses()]);renderUsers(data);setMessage(`已加载 ${data.length} 个成员`,'success');}catch(error){setMessage(`加载失败：${error.message}`,'error');}}
document.querySelector('#warehouse-picker-options').onchange=event=>{if(event.target.matches('[data-warehouse-choice]'))syncSelectFromPicker();};
document.querySelector('#role').onchange=applyRoleState;
document.querySelector('#create-user').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({login:document.querySelector('#login').value.trim(),display_name:document.querySelector('#display-name').value.trim(),password:document.querySelector('#password').value,role:document.querySelector('#role').value,warehouse_ids:[...warehouseIds.selectedOptions].map(item=>Number(item.value))})});event.target.reset();applyRoleState();setMessage('账户创建成功','success');await load();}catch(error){setMessage(`创建失败：${error.message}`,'error');}finally{button.disabled=false;}};
users.onclick=async event=>{const button=event.target.closest('button[data-action]');if(!button)return;const id=button.dataset.id;const action=button.dataset.action;try{if(action==='edit'){const name=prompt('新的显示名称');if(name===null)return;const role=prompt('角色：admin / operations / warehouse / customer_service / readonly', '');if(role===null)return;await api(`/api/admin/users/${id}`,{method:'PATCH',body:JSON.stringify({display_name:name,role:role||undefined})});}else if(action==='reset'){const password=prompt('输入新密码（至少 8 位）');if(password===null)return;await api(`/api/admin/users/${id}/reset-password`,{method:'POST',body:JSON.stringify({password})});}else if(action==='grant'){return;}else if(action==='revoke'){await api(`/api/admin/users/${id}/warehouses/${button.dataset.warehouseId}`,{method:'DELETE'});}else{await api(`/api/admin/users/${id}/${action}`,{method:'POST',body:'{}'});}setMessage('操作成功','success');await load();}catch(error){setMessage(`操作失败：${error.message}`,'error');}};
users.onchange=async event=>{const select=event.target.closest('select[data-action="grant"]');if(!select||!select.value)return;try{await api(`/api/admin/users/${select.dataset.id}/warehouses/${select.value}`,{method:'POST',body:'{}'});setMessage('仓库授权成功','success');await load();}catch(error){setMessage(`授权失败：${error.message}`,'error');}finally{select.value='';}};
warehousesBody.onclick=async event=>{const button=event.target.closest('button[data-action="bind"]');if(!button)return;if(!confirm('仅将未绑定仓库绑定到当前工作空间，继续吗？'))return;try{await api(`/api/admin/warehouses/${button.dataset.id}/bind`,{method:'POST',body:'{}'});setMessage('旧仓库绑定成功','success');await load();}catch(error){setMessage(`绑定失败：${error.message}`,'error');}};
document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=async()=>{try{await api('/logout',{method:'POST',body:'{}'});location.href='/login';}catch(error){setMessage(`退出失败：${error.message}`,'error');}};load();
</script>
</body></html>

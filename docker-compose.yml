services:
  mysql:
    image: mysql:8.4
    container_name: dianshang-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dianshang
      MYSQL_USER: dianshang
      MYSQL_PASSWORD: dianshang
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
